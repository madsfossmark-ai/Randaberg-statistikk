<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Statistikk Norge U20</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kampstatistikk">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: benk-verktøy, iPad liggende først – tre kolonner (registrering | registrering | løpende tall), stables på smal skjerm */
:root {
  --bg: #F2F1EC; --surface: #FFFFFF; --sunk: #E7E5DE; --line: #D9D6CD;
  --fg: #16181D; --muted: #4A4F5A; --faint: #6B7080;
  --accent: #1B4592; --accent-soft: #DCE4F5; --accent-fg: #FFFFFF;
  --opp: #8A3E0F; --opp-soft: #F5DFCF; --opp-strong: #C85E1C;
  --bad: #B3261E; --block: #7A1A14; --neutral: #5C6270; --good: #1F7A4D;
  --bar: #16181D; --bar-fg: #FFFFFF; --bar-muted: #B8BCC6;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121418; --surface: #1C1F25; --sunk: #262A32; --line: #343944;
  --fg: #ECEDEF; --muted: #A7ADB8; --faint: #8E94A0;
  --accent: #7FA3E8; --accent-soft: #23314F; --accent-fg: #0E1424;
  --opp: #F0A774; --opp-soft: #3A2A1F; --opp-strong: #D9773A;
  --bad: #D9473E; --block: #9C2B23; --neutral: #6A7180; --good: #2E9963;
  --bar: #0B0C0F; --bar-fg: #FFFFFF; --bar-muted: #A7ADB8; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121418; --surface: #1C1F25; --sunk: #262A32; --line: #343944;
  --fg: #ECEDEF; --muted: #A7ADB8; --faint: #8E94A0;
  --accent: #7FA3E8; --accent-soft: #23314F; --accent-fg: #0E1424;
  --opp: #F0A774; --opp-soft: #3A2A1F; --opp-strong: #D9773A;
  --bad: #D9473E; --block: #9C2B23; --neutral: #6A7180; --good: #2E9963;
  --bar: #0B0C0F; --bar-fg: #FFFFFF; --bar-muted: #A7ADB8; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px;
  -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.display { font-family: var(--font-display); font-weight: 700; line-height: 1; }

.app { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

/* Topplinje */
.bar { background: var(--bar); color: var(--bar-fg); border-radius: 14px; padding: 10px 14px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.bar a, .bar .link { color: #C9D6F0; text-decoration: none; background: none; border: 0; padding: 8px 4px; font-size: 14px; }
.bar .title { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.bar .title .display { font-size: 24px; }
.bar .sub { font-size: 12px; color: var(--bar-muted); }
.spacer { flex: 1; }
.score { display: flex; align-items: center; gap: 8px; }
.score .team { font-size: 13px; color: var(--bar-muted); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score .pts { font-family: var(--font-display); font-size: 40px; font-weight: 700; min-width: 50px; text-align: center; }
.sbtn { width: 46px; height: 46px; border-radius: 10px; border: 1px solid #3A3F49; background: transparent; color: #FFFFFF; font-size: 22px; }
.sbtn.plus-us { background: #2F63C4; border-color: #2F63C4; }
.sbtn.plus-them { background: var(--opp-strong); border-color: var(--opp-strong); }
.barbtn { height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #3A3F49; background: transparent; color: #FFFFFF; font-weight: 600; font-size: 14px; }
.sets { font-family: var(--font-display); font-size: 18px; color: var(--bar-muted); }

/* Generelle flater */
.panel { background: var(--surface); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.panel-head h2 { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.panel.opp .panel-head h2 { color: var(--opp); }
.textbtn { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 13px; padding: 8px 0; }
.empty { font-size: 13px; color: var(--muted); padding: 6px 0; }

.score-wrap { display: flex; align-items: center; gap: 18px; }
.setpill { font-family: var(--font-display); font-weight: 700; font-size: 30px; padding: 2px 14px; border-radius: 10px; background: #2A2E37; }
.barbtn.primary-bar { background: #2F63C4; border-color: #2F63C4; }
.setform { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.setin { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--bar-muted); }
.setin input { width: 64px; height: 46px; box-sizing: border-box; border: 1px solid #3A3F49; border-radius: 10px; background: #2A2E37; color: #FFFFFF; text-align: center; font-family: var(--font-display); font-size: 26px; font-weight: 700; }
.setform .dash { font-family: var(--font-display); font-size: 26px; color: var(--bar-muted); padding-top: 14px; }
.sk .sk-sc { font-weight: 500; margin-left: 6px; }
.barbtn.win { background: var(--good); border-color: var(--good); }
.barbtn.lose { background: var(--opp-strong); border-color: var(--opp-strong); }
.bar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Registrering: én rad per spiller, ett trykk. Mobil: alt stablet. Nettbrett: registrering side om side, tall under. Bred iPad: tre kolonner på én skjerm */
.live-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-items: start; }
.sa-head, .sa-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px 12px; align-items: center; }
.sa-head .label:not(:first-child) { text-align: center; }
.step { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 99px; background: var(--accent); color: var(--accent-fg); font-size: 11px; margin-right: 6px; letter-spacing: 0; }
.panel.opp .step { background: var(--opp-strong); color: #FFFFFF; }
.sa-grp { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.stat-block { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.stats-body { display: flex; flex-direction: column; gap: 14px; }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.who { display: flex; align-items: center; gap: 8px; min-width: 0; }
.nr { flex: none; min-width: 32px; height: 32px; padding: 0 4px; box-sizing: border-box; border-radius: 99px; background: var(--fg); color: var(--bg); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 16px; }
.nr.opp { background: var(--opp-strong); color: #FFFFFF; }
.nm { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.mini { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.codes { display: flex; gap: 6px; }
.code { width: 52px; height: 48px; border: 0; border-radius: 10px; color: #FFFFFF; font-family: var(--font-display); font-weight: 700; font-size: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; transition: transform .08s; }
.code small { font-family: var(--font-body); font-size: 10px; font-weight: 500; margin-top: 2px; }
.code:active { transform: scale(.94); }
.c-bad { background: var(--bad); } .c-block { background: var(--block); } .c-mid { background: var(--neutral); } .c-good { background: var(--good); }
.code.flash { box-shadow: 0 0 0 4px var(--accent); }
.code-legend { font-size: 12px; color: var(--muted); }
.addopp { display: flex; gap: 6px; }
.addopp input { width: 90px; height: 44px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 0 10px; font-size: 16px; }
.addopp button { height: 44px; padding: 0 12px; border-radius: 10px; border: 1px dashed var(--opp); background: var(--surface); color: var(--opp); font-weight: 600; }

/* Siste registreringer */
.lastbar { background: var(--surface); border-radius: 14px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
.chip { font-size: 13px; padding: 6px 10px; border-radius: 99px; background: var(--sunk); }
.chip.first { background: var(--accent-soft); font-weight: 600; }
.undo { height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--bad); background: var(--surface); color: var(--bad); font-weight: 600; }
.undo:disabled { opacity: .4; cursor: default; }

/* Statistikk */
.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.seg button { height: 34px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.tbl th { font-size: 11px; font-weight: 500; color: var(--muted); text-align: right; padding: 2px 4px 4px; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl td { text-align: right; padding: 4px; border-top: 1px solid var(--sunk); }
.tbl tr.total td { font-weight: 700; border-top: 1px solid var(--line); }
.tbl td.key { font-weight: 600; }
.tbl-wrap { overflow-x: auto; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.kpi { background: var(--sunk); border-radius: 8px; padding: 6px 8px; }
.kpi .display { font-size: 22px; }
.kpi .k { font-size: 11px; color: var(--muted); }
.warn { color: var(--bad); }
.small-n { color: var(--faint); }

/* Kampliste */
.listhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.listhead h1 { font-family: var(--font-display); font-size: 40px; font-weight: 700; line-height: 1; }
.tabs { display: inline-flex; gap: 4px; background: var(--sunk); padding: 4px; border-radius: 10px; }
.tabs button { height: 38px; padding: 0 16px; border: 0; border-radius: 7px; background: transparent; font-weight: 500; }
.tabs button[aria-pressed="true"] { background: var(--surface); font-weight: 600; }
.primary { height: 46px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.secondary { height: 46px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--accent); background: var(--surface); color: var(--accent); font-weight: 600; }
.next { background: var(--accent); color: var(--accent-fg); border-radius: 14px; padding: 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.next .display { font-size: 30px; }
.next .meta { font-size: 13px; opacity: .85; }
.next button { height: 48px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--surface); color: var(--accent); font-weight: 600; }
.rounds { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; align-items: start; }
.round { display: flex; flex-direction: column; gap: 6px; }
.match { display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; background: var(--surface); border: 0; border-radius: 10px; padding: 10px 12px; min-height: 52px; }
.match .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.match .tn { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.match.ours .tn { font-weight: 600; }
.match .d { font-size: 12px; color: var(--muted); }
.match .res { font-family: var(--font-display); font-size: 22px; font-weight: 700; }
.badge { font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 99px; white-space: nowrap; }
.b-own { background: var(--accent-soft); color: var(--accent); }
.b-nvbf { background: var(--sunk); color: var(--muted); }
.b-live { background: var(--good); color: #FFFFFF; }

/* Skjema */
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input, .field select { height: 44px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 0 10px; font-size: 15px; }

/* Tropp */
.squad { width: 100%; border-collapse: collapse; }
.squad th { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 6px; }
.squad td { padding: 6px; border-top: 1px solid var(--sunk); vertical-align: middle; }
.squad input[type=text] { height: 42px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 0 8px; width: 100%; }
.squad input.nrin { width: 60px; text-align: center; font-family: var(--font-display); font-size: 18px; font-weight: 700; }
.squad select { height: 42px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 0 6px; }
.tog { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 18px; color: var(--accent-fg); }
.tog[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.tog:disabled { opacity: .35; cursor: default; }
.squad td.c { text-align: center; }
.del { background: none; border: 0; color: var(--bad); font-size: 13px; font-weight: 600; padding: 8px; }
.status { font-size: 13px; color: var(--muted); }
.notice { background: var(--opp-soft); color: var(--fg); border-radius: 10px; padding: 10px 12px; font-size: 14px; }


/* Kampark: fast lyst oppsett som Excel-arket, uansett tema */
.sk-wrap { overflow-x: auto; background: var(--surface); border-radius: 14px; padding: 12px; }
.sk-sheet { background: #FFFFFF; color: #111111; padding: 8px; width: max-content; min-width: 100%; box-sizing: border-box; }
.sk { border-collapse: collapse; font-family: "IBM Plex Sans", Calibri, Arial, sans-serif; font-size: 13px; }
.sk td { border: 1px solid #FFFFFF; padding: 3px 6px; white-space: nowrap; }
.sk .sk-title { background: #000000; color: #FFFFFF; font-weight: 700; font-style: italic; font-size: 16px; text-align: center; padding: 6px 10px; }
.sk .sk-legend { color: #C00000; font-weight: 600; font-size: 13px; line-height: 1.5; padding-left: 14px; }
.sk .sk-res { padding: 4px 0 2px; }
.sk .sk-gap { height: 10px; border: 0; }
.sk .sk-blank { border: 0; }
.sk .sk-band { background: #9DC3E6; text-align: center; font-weight: 700; font-style: italic; }
.sk .sk-sub { font-weight: 500; font-style: normal; font-size: 12px; }
.sk .sk-sh { font-weight: 700; }
.sk .g { background: #D9D9D9; } .sk .gr { background: #70AD47; }
.sk .sk-th { background: #FFE699; font-weight: 700; text-align: center; border: 1px solid #333333; min-width: 54px; }
.sk .sk-t { background: #FFE699; text-align: right; border: 1px solid #333333; }
.sk .sk-name { text-align: right; padding-right: 8px; border-bottom: 1px solid #BBBBBB; }
.sk .sk-c { min-width: 120px; letter-spacing: .35em; font-variant-numeric: tabular-nums; }
.sk .sk-empty { color: #666666; }
.sk .red { color: #C00000; } .sk .ace { color: #1F6B2E; }
@media (min-width: 760px) {
  .live-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .col.stats { grid-column: 1 / -1; }
  .stats-body { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 20px; }
}
@media (min-width: 1100px) {
  .live-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .p-rec { grid-column: 1; grid-row: 1; } .p-att { grid-column: 2; grid-row: 1; }
  .p-srv { grid-column: 1; grid-row: 2; } .p-opp { grid-column: 2; grid-row: 2; }
  .col.stats { grid-column: 1 / -1; grid-row: 3; }
  .stats-body { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 24px; }
  .codes { gap: 8px; }
  .code { width: 68px; height: 52px; font-size: 24px; }
  .nm { font-size: 16px; }
  .panel { gap: 6px; padding: 10px 14px; }
}
@media (max-width: 759px) {
  .bar { gap: 8px; }
  .bar .title { flex: 1 1 55%; }
  .bar .spacer { display: none; }
  .score-wrap { order: 3; width: 100%; justify-content: space-between; gap: 8px; }
  .bar-actions { order: 4; width: 100%; }
  .bar-actions .barbtn { flex: 1; padding: 0 8px; }
  .score .pts { font-size: 32px; min-width: 38px; }
  .score .team { max-width: 70px; }
  .sa-head { display: none; }
  .sa-row { grid-template-columns: minmax(0, 3fr) minmax(0, 4fr); gap: 6px 10px; padding-bottom: 6px; border-bottom: 1px solid var(--sunk); }
  .sa-row .who { grid-column: 1 / -1; }
  .sa-row .codes .code { flex: 1; width: auto; min-width: 0; }
  .grp-lbl { display: block; font-size: 10px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .squad .hide-sm { display: none; }
}
@media (min-width: 760px) { .grp-lbl { display: none; } }
/* Liten iPhone (SE/mini): smalere kodeknapper så navnet får plass */
@media (max-width: 420px) {
  .code { width: 46px; height: 46px; font-size: 20px; }
  .codes { gap: 5px; }
  .nr { min-width: 28px; height: 28px; font-size: 14px; }
  .nm { font-size: 14px; }
  .panel { padding: 10px; }
}
/* iPhone liggende: lav skjerm, kompakt topplinje, to kolonner */
@media (max-height: 500px) and (min-width: 600px) {
  .bar { padding: 6px 12px; gap: 10px; }
  .bar .title .display { font-size: 19px; }
  .setpill { font-size: 22px; }
  .barbtn { height: 38px; font-size: 13px; padding: 0 10px; }
  .live-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .p-rec, .p-att, .p-srv, .p-opp { grid-column: auto; grid-row: auto; }
  .col.stats { grid-column: 1 / -1; grid-row: auto; }
  .code { height: 42px; }
}
@media (prefers-reduced-motion: reduce) { .code { transition: none; } }
html.is-fs, html.is-fs body { height: 100%; overflow: hidden; overscroll-behavior: none; }
html.is-fs body { box-sizing: border-box; }
html.is-fs .app { height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

/* Sesong: oppsummering øverst, så kurve kamp for kamp, terminplan, kamp- og spillertabell */
.season { display: flex; flex-direction: column; gap: 12px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 10px; }
.tile { background: var(--surface); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .big { font-family: var(--font-display); font-weight: 700; font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums; }
.tile .sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chart-box { width: 100%; overflow: hidden; }
.chart-box svg { display: block; width: 100%; height: auto; }
.chart-box text { font-family: var(--font-body); }
.fixtures { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 168px), 1fr)); gap: 8px; }
.fx { display: flex; flex-direction: column; gap: 4px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.fx.next-fx { border: 2px solid var(--accent); }
.fx.future { background: transparent; }

<script>
/* Lesemodus: erstatter Claude-lagringen med data.json */
window.PUBLIC = true;
window.PUBLIC_UPDATED = "21.10.2026 kl. 14:25";
window.PUBLIC_CTX = {"id": "u20-nevza-2026", "name": "Norge U20 kvinner · NEVZA 2026", "our": "Norge", "prefix": "", "teams": ["Danmark", "England", "Finland", "Sverige"]};
(function () {
  const dataP = fetch('data.json', { cache: 'no-cache' }).then((r) => r.json());
  const colSnap = (pairs) => ({ docs: pairs.map(([id, d]) => ({ id, data: () => d })) });
  const fail = (err) => () => err && err({ code: 'kunne ikke hente data' });
  function collection(path) {
    const p = path.split('/');
    return {
      onSnapshot(cb, err) {
        dataP.then((D) => {
          if (path === 'matches') cb(colSnap(D.matches.map((m) => [m.id, m.data])));
          else if (p[0] === 'matches' && p[2] === 'log') cb(colSnap(Object.entries(D.logs[p[1]] || {})));
          else if (path === 'opponents') cb(colSnap(Object.entries(D.opponents || {})));
          else cb(colSnap([]));
        }).catch(fail(err));
        return () => {};
      },
      add: async () => { throw { code: 'kun lesing' }; }
    };
  }
  function doc(path) {
    return {
      onSnapshot(cb, err) {
        dataP.then((D) => {
          const d = path === 'config/roster' ? { players: D.roster } : null;
          cb({ exists: !!d, data: () => d || {} });
        }).catch(fail(err));
        return () => {};
      },
      set: async () => {}, update: async () => {}
    };
  }
  const downloads = {
    async save({ filename, data }) {
      const blob = data instanceof Blob ? data : new Blob([data], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }
  };
  window.claude = { use: async (n) => (n === 'db' ? { doc, collection } : n === 'downloads' ? downloads : null) };
})();
</script>

<script>
(() => {
  // Sesong eller lag: hver kontekst har egne kamper, egen tropp og egne motstandere.
  // Hovedkonteksten ligger i roten av databasen; de andre under ctx/<id>/.
  // Den åpne lesesiden kan bygges for en annen sesong eller et annet lag (window.PUBLIC_CTX)
  const MAIN_CTX = window.PUBLIC_CTX || { id: 'main', name: 'Randaberg · Mizunoligaen kvinner 26/27', our: 'Randaberg', prefix: '',
    teams: ['Finstad Sportsklubb', 'Førde Volleyballklubb', 'Koll IL', 'ØKSIL', 'OSI', 'Oslo Volley', 'TIF Viking', 'ToppVolley Norge'] };
  let CTX = MAIN_CTX, PFX = '', OUR = 'Randaberg';
  const POS = ['Opplegger', 'Diagonal', 'Kant', 'Midt', 'Libero'];
  const app = document.getElementById('app');

  const S = {
    db: null, dl: null, ready: false, offline: false,
    roster: [], matches: [], logs: {}, logUnsub: null, opps: {}, contexts: [MAIN_CTX], ctxReady: false, showNewCtx: false,
    view: 'list', matchId: null, filter: 'alle', statSet: 'all',
    showNew: false, flash: null, error: ''
  };

  let deviceId = null;
  try { deviceId = localStorage.getItem('rv-device'); } catch (e) {}
  if (!deviceId) { deviceId = 'd' + Math.random().toString(36).slice(2, 10); try { localStorage.setItem('rv-device', deviceId); } catch (e) {} }
  try { const v = localStorage.getItem('rv-view'); if (v) { const o = JSON.parse(v); S.filter = o.filter || 'alle'; } } catch (e) {}

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pct = (a, b) => b ? Math.round((a / b) * 100) + ' %' : '–';
  const pct1 = (a, b) => b ? (Math.round((a / b) * 1000) / 10).toString().replace('.', ',') + ' %' : '–';
  const dec = (x) => (Math.round(x * 100) / 100).toFixed(2).replace('.', ',');
  const fmtDate = (iso) => { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return iso; return d.toLocaleDateString('nb-NO', { weekday: 'short', day: 'numeric', month: 'short' }) + (iso.length > 10 ? ' · ' + d.toLocaleTimeString('nb-NO', { hour: '2-digit', minute: '2-digit' }) : ''); };
  const isOurs = (m) => m.home === OUR || m.away === OUR;
  const cur = () => S.matches.find((m) => m.id === S.matchId);
  // Spillere på et annet lag (når vi fører statistikk for andres kamper) har id «o:<lag>:<nr>»
  const player = (id) => {
    if (typeof id === 'string' && id.startsWith('o:')) {
      const [, slug, nr] = id.split(':'); const p = ((S.opps[slug] || {}).players || []).find((x) => String(x.nr) === nr) || {};
      return { id, nr, name: p.name || '#' + nr, pos: p.pos || '' };
    }
    return S.roster.find((p) => p.id === id);
  };
  const EXTRA = { midt: 'Midtspillere' };
  const pname = (id) => { const p = player(id); return p ? p.name.split(' ')[0] : (EXTRA[id] || '?'); };
  // Kamptyper: serie fra terminlisten, eller egne kamper (cup, europacup, trening)
  const TYPES = { serie: 'Seriekamp', cup: 'Cupkamp', europacup: 'Europacup', turnering: 'Turnering', trening: 'Treningskamp' };
  const TSHORT = { serie: 'Serie', cup: 'Cup', europacup: 'EC', turnering: 'T', trening: 'Tr' };
  const roundLabel = (m) => m.custom ? (m.type === 'turnering' && m.round ? m.round : (TYPES[m.type] || 'Egen kamp') + (m.round ? ' · ' + m.round : '')) : (m.round ? 'Runde ' + m.round : 'Uten runde');
  const roundShort = (m) => m.custom ? (m.short || TSHORT[m.type] || 'Egen') : 'R' + (m.round || '?');
  // Motstanderens tropp lagres per lag og huskes til neste kamp mot samme lag
  const teamSlug = (s) => String(s || '').toLowerCase().replace(/æ/g, 'ae').replace(/ø/g, 'o').replace(/å/g, 'a').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'lag';
  const usName = (m) => (m && m.focus) || OUR;
  const canLive = (m) => isOurs(m) || !!(m && m.focus);
  const oppTeam = (m) => m.home === usName(m) ? m.away : m.home;
  const rosterOf = (team) => ((S.opps[teamSlug(team)] || {}).players || []);
  const oppRoster = (m) => rosterOf(oppTeam(m));
  const teamRoster = (m) => m && m.focus ? rosterOf(m.focus).map((p) => ({ id: 'o:' + teamSlug(m.focus) + ':' + p.nr, nr: String(p.nr), name: p.name || '#' + p.nr, pos: p.pos || '' })) : S.roster;
  const isSlot = (t) => /^\d\. plass$/.test(String(t || ''));
  const oppP = (m, nr) => oppRoster(m).find((p) => String(p.nr) === String(nr));
  const oppLabel = (m, nr) => { const p = m && oppP(m, nr); return '#' + nr + (p && p.name ? ' ' + p.name.split(' ')[0] : ''); };

  // ---------- Data ----------
  async function boot() {
    try { S.db = await window.claude?.use?.('db'); } catch (e) { S.db = null; }
    try { S.dl = await window.claude?.use?.('downloads'); } catch (e) { S.dl = null; }
    if (!S.db) { S.offline = true; S.ready = true; render(); return; }
    let saved = null; try { saved = localStorage.getItem('rv-ctx'); } catch (e) {}
    S.db.doc('config/contexts').onSnapshot((snap) => {
      const list = snap.exists ? (snap.data().list || []) : [];
      S.contexts = [MAIN_CTX].concat(list.filter((c) => c && c.id && c.id !== 'main'));
      if (!S.ctxReady) { S.ctxReady = true; applyCtx(saved || 'main'); }
      else if (!S.contexts.some((c) => c.id === CTX.id)) applyCtx('main');
      else { CTX = S.contexts.find((c) => c.id === CTX.id); render(); }
    }, () => { if (!S.ctxReady) { S.ctxReady = true; applyCtx('main'); } });
  }

  let ctxUnsubs = [];
  function applyCtx(id) {
    CTX = S.contexts.find((c) => c.id === id) || MAIN_CTX;
    PFX = CTX.prefix || ''; OUR = CTX.our || 'Randaberg';
    try { localStorage.setItem('rv-ctx', CTX.id); } catch (e) {}
    ctxUnsubs.forEach((u) => { try { u(); } catch (e) {} }); ctxUnsubs = [];
    closeSeasonLogs(); openLogs(null);
    S.roster = []; S.matches = []; S.opps = {}; S.ready = false; S.view = 'list'; S.matchId = null; S.showNew = false; S.showNewCtx = false;
    SEASON.player = 'team';
    render(); toTop();
    subscribeCtx();
  }
  function subscribeCtx() {
    const keep = (u) => { if (typeof u === 'function') ctxUnsubs.push(u); };
    keep(S.db.doc(PFX + 'config/roster').onSnapshot((snap) => {
      S.roster = snap.exists ? (snap.data().players || []).map((p) => ({ ...p })) : [];
      S.ready = true; render();
    }, (e) => { S.error = 'Kunne ikke laste troppen (' + e.code + ').'; render(); }));
    keep(S.db.collection(PFX + 'opponents').onSnapshot((snap) => {
      const o = {}; snap.docs.forEach((d) => { o[d.id] = JSON.parse(JSON.stringify(d.data())); }); S.opps = o; render();
    }, () => {}));
    keep(S.db.collection(PFX + 'matches').onSnapshot((snap) => {
      S.matches = snap.docs.map((d) => ({ id: d.id, ...JSON.parse(JSON.stringify(d.data())) }));
      S.matches.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
      S.ready = true; if (S.view === 'season') openSeasonLogs(); render();
    }, (e) => { S.error = 'Kunne ikke laste kamper (' + e.code + ').'; render(); }));
  }

  function ctxPicker() {
    if (window.PUBLIC || S.offline) return '<span class="label">' + esc(CTX.name) + '</span>';
    return '<label class="ctx-pick" for="ctx-pick"><span class="sr">Sesong eller lag</span><select id="ctx-pick" data-a="ctx">'
      + S.contexts.map((c) => '<option value="' + esc(c.id) + '"' + (c.id === CTX.id ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('')
      + '<option value="__new">+ Ny sesong eller lag …</option></select></label>';
  }
  function newCtxForm() {
    return '<form class="panel" id="ctxform" aria-label="Ny sesong eller lag"><div class="panel-head"><h2>Ny sesong eller lag</h2><span class="status">Får egne kamper, egen tropp og egen sesongstatistikk. Det du har nå, ligger urørt og kan velges i menyen.</span></div><div class="form">'
      + '<div class="field"><label for="ctx-name">Navn</label><input id="ctx-name" type="text" required placeholder="F.eks. Randaberg · Mizunoligaen kvinner 27/28"></div>'
      + '<div class="field"><label for="ctx-our">Vårt lag heter</label><input id="ctx-our" type="text" required value="' + esc(OUR) + '"></div>'
      + '<label class="chk" for="ctx-copy"><input id="ctx-copy" type="checkbox"> Ta med spillertroppen fra «' + esc(CTX.name) + '»</label>'
      + '<div style="display:flex;gap:8px"><button class="primary" type="submit">Opprett</button><button class="secondary" type="button" data-a="ctx-cancel">Avbryt</button></div></div></form>';
  }

  function openLogs(id) {
    if (S.logUnsub) { S.logUnsub(); S.logUnsub = null; }
    S.logs = {};
    if (!S.db || !id) return;
    S.logUnsub = S.db.collection(PFX + 'matches/' + id + '/log').onSnapshot((snap) => {
      const logs = {};
      snap.docs.forEach((d) => { logs[d.id] = (d.data().events || []).slice(); });
      S.logs = logs; render();
    }, (e) => { S.error = 'Registreringene kunne ikke lastes (' + e.code + ').'; render(); });
  }

  function allEvents() { const out = []; Object.values(S.logs).forEach((a) => out.push(...a)); out.sort((a, b) => a.t - b.t); return out; }

  async function saveMatch(id, patch) {
    if (!S.db) return;
    try { await S.db.doc(PFX + 'matches/' + id).update(patch); }
    catch (e) { S.error = 'Lagring feilet (' + e.code + '). Prøv igjen.'; render(); }
  }
  async function saveRoster(players) {
    S.roster = players; render();
    if (!S.db) return;
    try { await S.db.doc(PFX + 'config/roster').set({ players }); }
    catch (e) { S.error = 'Troppen ble ikke lagret (' + e.code + ').'; render(); }
  }

  async function logEvent(type, who, code, extra) {
    const m = cur(); if (!m || !S.db) return;
    const set = (m.current && m.current.set) || 1;
    const key = deviceId + '-s' + set;
    const own = (S.logs[key] || []).slice();
    const ev = Object.assign({ t: Date.now(), set, type, p: who, c: code }, extra || {});
    own.push(ev);
    S.logs[key] = own;
    render();
    try { await S.db.doc(PFX + 'matches/' + m.id + '/log/' + key).set({ device: deviceId, set, events: own }); }
    catch (e) { S.error = 'Registreringen ble ikke lagret (' + e.code + ').'; render(); }
    if (m.status !== 'pågår' && m.status !== 'ferdig') saveMatch(m.id, { status: 'pågår' });
  }

  async function undo() {
    const m = cur(); if (!m || !S.db) return;
    let bestKey = null, bestT = -1;
    Object.entries(S.logs).forEach(([k, evs]) => { if (k.startsWith(deviceId + '-') && evs.length && evs[evs.length - 1].t > bestT) { bestT = evs[evs.length - 1].t; bestKey = k; } });
    if (!bestKey) return;
    const own = S.logs[bestKey].slice(0, -1);
    S.logs[bestKey] = own; render();
    try { await S.db.doc(PFX + 'matches/' + m.id + '/log/' + bestKey).set({ device: deviceId, set: Number(bestKey.split('-s')[1]), events: own }); }
    catch (e) { S.error = 'Angre ble ikke lagret (' + e.code + ').'; render(); }
  }

  // ---------- Statistikk ----------
  function computeStats(events) {
    const rec = {}, att = {}, srv = {}, opp = {};
    const bump = (o, k) => (o[k] ||= { n: 0, s: 0, c0: 0, c1: 0, c2: 0, B: 0, F: 0, I: 0, E: 0 });
    events.forEach((e) => {
      if (e.type === 'rec') { const r = bump(rec, e.p); r.n++; r['c' + e.c]++; r.s += Number(e.c); }
      if (e.type === 'opp') { const r = bump(opp, e.p); r.n++; r['c' + e.c]++; r.s += Number(e.c); }
      if (e.type === 'att') { const r = bump(att, e.p); r.n++; if (e.c === 'B') r.B++; else r['c' + e.c]++; }
      if (e.type === 'srv') { const r = bump(srv, e.p); r.n++; r[e.c]++; }
    });
    const sum = (o) => Object.values(o).reduce((a, r) => { Object.keys(r).forEach((k) => a[k] = (a[k] || 0) + r[k]); return a; }, { n: 0, s: 0, c0: 0, c1: 0, c2: 0, B: 0, F: 0, I: 0, E: 0 });
    return { rec, att, srv, opp, tRec: sum(rec), tAtt: sum(att), tSrv: sum(srv), tOpp: sum(opp) };
  }

  // ---------- Visninger ----------
  function render() {
    if (S.view === 'live' && !S.offline && cur()) {
      const root = document.getElementById('live-root');
      if (root && root.dataset.sig === liveSig(cur())) { updateLive(); return; }
    }
    const active = document.activeElement;
    const keepId = active && active.id && active.tagName !== 'SELECT' ? active.id : null;
    let selStart = null; try { selStart = active && 'selectionStart' in active ? active.selectionStart : null; } catch (e) {}
    const keepVal = active && active.tagName === 'INPUT' ? active.value : null;
    let html = '';
    if (S.offline) html = offlineView();
    else if (!S.ready) html = '<div class="panel"><div class="empty">Laster kamper …</div></div>';
    else if (S.view === 'live' && cur()) html = liveView();
    else if (S.view === 'squad' && cur()) html = squadView();
    else if (S.view === 'detail' && cur()) html = detailView();
    else if (S.view === 'sheet' && cur()) html = sheetView();
    else if (S.view === 'season') html = seasonView();
    else if (S.view === 'table') html = tableView();
    else html = listView();
    app.innerHTML = '<div id="err">' + errHtml() + '</div>' + html;
    if (S.view === 'live') fillMini();
    dirSync();
    if (keepId) { const el = document.getElementById(keepId); if (el) { if (keepVal != null && el.tagName === 'INPUT') el.value = keepVal; el.focus(); try { if (selStart != null && el.setSelectionRange) el.setSelectionRange(selStart, selStart); } catch (e) {} } }
  }

  function offlineView() {
    return '<div class="panel"><h2 class="display" style="font-size:28px">Kampstatistikk</h2><div class="empty">Lagringen er ikke tilgjengelig i denne visningen. Åpne siden i Claude-appen eller på claude.ai mens du er innlogget for å føre statistikk.</div></div>';
  }

  function listView() {
    const ms = S.matches.filter((m) => S.filter === 'alle' ? true : S.filter === 'vare' ? isOurs(m) : !isOurs(m));
    const upcoming = S.matches.filter((m) => isOurs(m) && m.status !== 'ferdig').sort((a, b) => (a.date || '').localeCompare(b.date || ''))[0];
    const rounds = {};
    ms.forEach((m) => { const r = m.custom ? roundLabel(m) + '|' + m.id : roundLabel(m); (rounds[r] ||= []).push(m); });
    let h = '<div class="listhead"><div style="display:flex;flex-direction:column;gap:4px">' + ctxPicker() + '<h1>Kamper</h1>' + (window.PUBLIC ? '<span class="status">Oppdatert ' + window.PUBLIC_UPDATED + '</span>' : '') + '</div>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><div class="tabs" role="group" aria-label="Filter">'
      + [['alle', 'Alle'], ['vare', 'Våre'], ['andre', 'Andres']].map(([k, l]) => '<button data-a="filter" data-v="' + k + '" aria-pressed="' + (S.filter === k) + '">' + l + '</button>').join('')
      + '</div><button class="secondary" data-a="new-toggle">Ny kamp</button><button class="secondary" data-a="table">Tabell</button><button class="primary" data-a="season">Sesong</button>' + fsBtn('secondary') + '</div></div>';
    if (S.showNewCtx) h += newCtxForm();
    if (S.showNew) h += newMatchForm();
    if (upcoming) {
      h += '<section class="next" aria-label="Neste kamp"><div style="flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px"><span class="label" style="color:inherit;opacity:.8">' + (upcoming.status === 'pågår' ? 'Pågår nå' : 'Neste kamp') + ' · ' + esc(roundLabel(upcoming)) + '</span>'
        + '<div class="display">' + esc(upcoming.home) + ' – ' + esc(upcoming.away) + '</div><div class="meta">' + esc(fmtDate(upcoming.date)) + (upcoming.venue ? ' · ' + esc(upcoming.venue) : '') + '</div></div>'
        + '<button data-a="open" data-id="' + esc(upcoming.id) + '">' + (upcoming.status === 'pågår' ? 'Fortsett registrering' : 'Start registrering') + '</button></section>';
    }
    if (!ms.length) h += '<div class="panel"><div class="empty">Ingen kamper her ennå. Legg til en med «Ny kamp».</div></div>';
    h += '<div class="rounds">' + Object.entries(rounds).map(([r, list]) => '<section class="round"><h2 class="label">' + esc(r.split('|')[0]) + '</h2>' + list.map(matchRow).join('') + '</section>').join('') + '</div>';
    return h;
  }

  function matchRow(m) {
    const ours = isOurs(m);
    const res = (m.setsHome != null && m.setsAway != null && (m.setsHome + m.setsAway) > 0) ? m.setsHome + '–' + m.setsAway : (m.status === 'pågår' ? (m.setsHome || 0) + '–' + (m.setsAway || 0) : '–');
    const badge = m.status === 'pågår' ? '<span class="badge b-live">Live</span>' : ours || m.focus ? '<span class="badge b-own">Egenført</span>' : (m.nvbf && m.nvbf.teams ? '<span class="badge b-nvbf">NVBF-statistikk</span>' : m.source === 'nvbf' ? '<span class="badge b-nvbf">NVBF</span>' : '');
    return '<button class="match' + (ours ? ' ours' : '') + '" data-a="open" data-id="' + esc(m.id) + '"><span class="t"><span class="tn">' + esc(m.home) + ' – ' + esc(m.away) + '</span><span class="d">' + esc(fmtDate(m.date)) + (m.custom ? ' · ' + esc(TYPES[m.type] || 'Egen kamp') : '') + '</span></span><span class="res num">' + res + '</span>' + badge + '</button>';
  }

  function newMatchForm() {
    const teams = [...new Set((CTX.teams || []).concat(Object.values(S.opps).map((o) => o.name).filter(Boolean)))].sort((a, b) => a.localeCompare(b, 'nb'));
    return '<form class="panel" id="newform" aria-label="Ny kamp"><div class="panel-head"><h2>Ny kamp</h2><span class="status">Cup, europacup, treningskamp eller en kamp som mangler i terminlisten</span></div><div class="form">'
      + '<div class="field"><label for="nf-type">Type kamp</label><select id="nf-type">' + ['cup', 'europacup', 'turnering', 'trening', 'serie'].map((t) => '<option value="' + t + '">' + TYPES[t] + '</option>').join('') + '</select></div>'
      + '<div class="field"><label for="nf-opp">Motstander</label><input id="nf-opp" type="text" list="nf-teams" required autocomplete="off" placeholder="Skriv lagnavn"><datalist id="nf-teams">' + teams.map((t) => '<option value="' + esc(t) + '"></option>').join('') + '</datalist></div>'
      + '<div class="field"><label for="nf-ha">Hjemme/borte</label><select id="nf-ha"><option value="h">Hjemme</option><option value="b">Borte</option></select></div>'
      + '<div class="field"><label for="nf-date">Dato og tid</label><input id="nf-date" type="datetime-local" required></div>'
      + '<div class="field"><label for="nf-round">Runde eller fase (valgfritt)</label><input id="nf-round" type="text" placeholder="F.eks. 2. runde"></div>'
      + '<div class="field"><label for="nf-venue">Hall (valgfritt)</label><input id="nf-venue" type="text"></div>'
      + '<label class="chk" for="nf-season"><input id="nf-season" type="checkbox" checked> Med i sesongstatistikken</label>'
      + '<button class="primary" type="submit">Opprett kamp</button></div></form>';
  }

  function scoreBar(m) {
    const c = m.current || { set: 1, home: 0, away: 0 };
    const sets = (m.setScores || []).map((s) => s[0] + '–' + s[1]).join(' · ');
    return '<header class="bar"><button class="link" data-a="back">‹ Kamper</button>'
      + '<div class="title"><span class="display">' + esc(m.home) + ' – ' + esc(m.away) + '</span><span class="sub" id="bar-sub">' + esc(barSub(m)) + '</span></div>'
      + '<span class="spacer"></span><div class="score-wrap"><span class="setpill">Sett ' + c.set + '</span></div><span class="spacer"></span><div class="bar-actions">'
      + (S.endingSet
        ? '<form id="setform" class="setform"><span class="sub">Resultat sett ' + c.set + '</span>'
          + '<label class="setin"><span>' + esc(shortName(m.home)) + '</span><input id="sv-home" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="25" autocomplete="off"></label>'
          + '<span class="dash">–</span>'
          + '<label class="setin"><span>' + esc(shortName(m.away)) + '</span><input id="sv-away" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="23" autocomplete="off"></label>'
          + '<button class="barbtn win" type="submit">Lagre og start sett ' + (c.set + 1) + '</button><button class="barbtn" type="button" data-a="setcancel">Avbryt</button></form>'
        : '<button class="barbtn primary-bar" data-a="endset">Avslutt sett ' + c.set + '</button>'
          + ((m.setScores || []).length ? '<button class="barbtn" data-a="setback">Tilbake til sett ' + (c.set - 1) + '</button>' : '')
          + '<button class="barbtn" data-a="dir">Slagretning</button><button class="barbtn" data-a="squad">Tropp</button><button class="barbtn" data-a="sheet">Kampark</button>' + fsBtn('barbtn')
          + (m.status !== 'ferdig' ? '<button class="barbtn" data-a="endmatch">Avslutt kamp</button>' : '<button class="barbtn primary-bar" data-a="toview">Ferdig med endringer</button>'))
      + '</div></header>';
  }
  function barSub(m) {
    const us = m.home === usName(m) ? (m.setsHome || 0) : (m.setsAway || 0);
    const them = m.home === usName(m) ? (m.setsAway || 0) : (m.setsHome || 0);
    const sc = setList(m);
    return usName(m) + ' ' + us + '–' + them + ' i sett' + (sc ? ' · ' + sc : '') + (m.status === 'ferdig' ? ' · kampen er avsluttet' : '');
  }
  function shortName(n) { n = String(n || ''); return n === OUR ? n : n.replace(/ (Volleyballklubb|Sportsklubb|Volley Norge)$/, '').replace(/ IL$/, ''); }
  function scoreStr(sc) { return sc && Math.max(sc[0], sc[1]) >= 5 ? sc[0] + '–' + sc[1] : ''; }
  function setList(m) { return (m.setScores || []).map(scoreStr).filter(Boolean).join(', ');
  }

  function codeBtn(type, who, code, cls, big, small) {
    return '<button class="code ' + cls + '" data-a="log" data-t="' + type + '" data-p="' + esc(who) + '" data-c="' + code + '" aria-label="' + esc(small) + '">' + big + (small ? '<small>' + esc(small) + '</small>' : '') + '</button>';
  }

  function playerRows(ids, type, codes) {
    if (!ids.length) return '<div class="empty">Ingen valgt. Åpne Tropp og velg spillere.</div>';
    return ids.map((id) => { const p = player(id); if (!p) return ''; return '<div class="row"><div class="who"><span class="nr">' + esc(p.nr || '–') + '</span><span class="nm">' + esc(p.name.split(' ')[0]) + '</span><span class="mini" data-mini="' + type + '|' + esc(id) + '"></span></div><div class="codes">' + codes.map((c) => codeBtn(type, id, c[0], c[1], c[2], c[3])).join('') + '</div></div>'; }).join('');
  }

  const REC = [['0', 'c-bad', '0', 'Feil'], ['1', 'c-mid', '1', 'Spillbart'], ['2', 'c-good', '2', 'Perfekt']];
  const SRV = [['F', 'c-bad', 'F', 'Feil'], ['I', 'c-mid', 'I', 'I spill'], ['E', 'c-good', 'E', 'Ess']];
  const ATT = [['0', 'c-bad', '0', 'Feil'], ['B', 'c-block', 'B', 'Blokk'], ['1', 'c-mid', '1', 'I spill'], ['2', 'c-good', '2', 'Poeng']];

  function liveView() {
    const m = cur();
    const oppName = m.home === usName(m) ? m.away : m.home;
    const receivers = (m.receivers || []).map(player).filter(Boolean);
    const onCourt = (m.onCourt || []).map(player).filter(Boolean);
    const oppNums = m.oppNumbers || [];
    const evs = allEvents();

    let h = '<div id="live-root" data-sig="' + esc(liveSig(m)) + '" style="display:flex;flex-direction:column;gap:12px">' + scoreBar(m);
    h += '<div class="lastbar"><span class="label">Siste</span><div class="chips" id="last-chips">' + lastChips(evs, oppName) + '</div><button class="undo" id="undo-btn" data-a="undo"' + (ownCount() ? '' : ' disabled') + '>Angre siste</button></div>';

    const noCourt = '<div class="empty">Ingen på banen. Åpne Tropp og velg seks spillere.</div>';
    const courtBtn = '<button class="textbtn" data-a="squad">' + onCourt.length + ' på banen · endre</button>';
    h += '<div class="live-grid">'
      + '<section class="panel p-rec" aria-label="Eget mottak"><div class="panel-head"><h2><span class="step">1</span>Eget mottak</h2><button class="textbtn" data-a="squad">' + receivers.length + ' i mottak · endre</button></div>' + playerRows(receivers.map((p) => p.id), 'rec', REC) + (receivers.length && (receivers.length < 4 || receivers.length > 6) ? '<div class="code-legend warn">Velg 4–6 mottakere.</div>' : '') + '</section>'
      + '<section class="panel p-att" aria-label="Angrep"><div class="panel-head"><h2><span class="step">2</span>Angrep</h2>' + courtBtn + '</div>' + (onCourt.length ? playerRows(onCourt.map((p) => p.id), 'att', ATT) + '<div class="code-legend">0 feil · B blokkert · 1 i spill · 2 poeng</div>' : noCourt) + '</section>'
      + '<section class="panel p-srv" aria-label="Vår serve"><div class="panel-head"><h2><span class="step">3</span>Vår serve</h2>' + courtBtn + '</div>' + (onCourt.length ? playerRows(onCourt.map((p) => p.id), 'srv', SRV) + '<div class="code-legend">F feil · I i spill · E ess</div>' : noCourt) + '</section>'
      + '<section class="panel opp p-opp" aria-label="Motstanderens mottak"><div class="panel-head"><h2><span class="step">4</span>' + esc(oppName) + ' mottak</h2><button class="textbtn" data-a="dir" style="color:var(--opp)">Slagretning ›</button></div>'
      + (oppNums.length ? oppNums.map((n) => '<div class="row"><div class="who"><span class="nr opp">' + esc(n) + '</span>' + ((oppP(m, n) || {}).name ? '<span class="nm">' + esc(oppP(m, n).name.split(' ')[0]) + '</span>' : '') + '<span class="mini" data-mini="opp|' + esc(n) + '"></span></div><div class="codes">' + REC.map((c) => codeBtn('opp', n, c[0], c[1], c[2], c[3])).join('') + '</div></div>').join('') : '<div class="empty">Legg til draktnummer på mottakerne deres.</div>')
      + '<form class="addopp" id="oppform"><label for="opp-nr" class="label" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Draktnummer</label><input id="opp-nr" type="text" inputmode="numeric" placeholder="Nr" maxlength="3"><button type="submit">+ Nummer</button></form></section>'
      + '<div class="col stats" id="stats">' + statsPanel(m, evs, oppName) + '</div></div></div>';
    return h;
  }

  function liveSig(m) {
    return JSON.stringify([oppRoster(m), !!fsEl(), m.id, m.status, (m.current || {}).set, (m.setScores || []).length, S.endingSet, m.receivers, m.onCourt, m.oppNumbers, teamRoster(m).map((p) => [p.id, p.nr, p.name])]);
  }
  function ownCount() { return Object.entries(S.logs).filter(([k]) => k.startsWith(deviceId + '-')).reduce((a, [, v]) => a + v.length, 0); }
  function lastChips(evs, oppName) {
    const last = evs.slice(-6).reverse();
    return last.length ? last.map((e, i) => '<span class="chip' + (i === 0 ? ' first' : '') + '">' + esc(evLabel(e, oppName)) + '</span>').join('') : '<span class="chip">Ingen registreringer ennå</span>';
  }
  // Oppdaterer bare tall og lister, så knappene ikke byttes ut midt i et trykk
  function updateLive() {
    const m = cur(); const oppName = m.home === usName(m) ? m.away : m.home; const evs = allEvents();
    const sub = document.getElementById('bar-sub'); if (sub && sub.textContent !== barSub(m)) sub.textContent = barSub(m);
    const chips = document.getElementById('last-chips'); if (chips) chips.innerHTML = lastChips(evs, oppName);
    const u = document.getElementById('undo-btn'); if (u) u.disabled = !ownCount();
    const st = document.getElementById('stats'); if (st) st.innerHTML = statsPanel(m, evs, oppName);
    const er = document.getElementById('err'); if (er) er.innerHTML = errHtml();
    fillMini(); dirSync();
  }
  // Antall og snitt (0–2) ved siden av navnet: hele kampen
  function fillMini() {
    if (!cur()) return;
    const st = computeStats(allEvents());
    app.querySelectorAll('[data-mini]').forEach((el) => {
      const i = el.dataset.mini.indexOf('|'); const t = el.dataset.mini.slice(0, i), id = el.dataset.mini.slice(i + 1);
      const r = ({ rec: st.rec, att: st.att, srv: st.srv, opp: st.opp })[t][id];
      let txt = '';
      if (r && r.n) {
        if (t === 'rec' || t === 'opp') txt = r.n + ' · snitt ' + dec(r.s / r.n);
        else if (t === 'att') txt = r.n + ' · snitt ' + dec(1 + (r.c2 - r.c0 - r.B) / r.n);
        else txt = r.n + ' · ' + r.E + ' ess ' + r.F + ' feil';
      }
      el.textContent = txt;
    });
  }
  function errHtml() { return S.error ? '<div class="notice" role="alert">' + esc(S.error) + ' <button class="textbtn" data-a="clear-err">Lukk</button></div>' : ''; }

  function evLabel(e, oppName) {
    if (e.type === 'dir') return oppName + ' #' + e.p + ' · slag ' + dirKind(e) + (e.c ? ' ' + (DRES[e.c] || '').toLowerCase() : '');
    const lbl = { rec: 'mottak', att: 'angrep', srv: 'serve', opp: 'mottak' }[e.type];
    const code = e.type === 'srv' ? ({ F: 'feil', I: 'i spill', E: 'ess' }[e.c]) : e.type === 'att' && e.c === 'B' ? 'blokkert' : e.c;
    const who = e.type === 'opp' ? oppName + ' ' + oppLabel(cur(), e.p) : pname(e.p);
    return who + ' · ' + lbl + ' ' + code;
  }

  function statsPanel(m, evs, oppName) {
    const sets = [...new Set(evs.map((e) => e.set))].sort((a, b) => a - b);
    const cs = (m.current && m.current.set) || 1;
    if (!sets.includes(cs)) sets.push(cs);
    const filt = S.statSet === 'all' ? evs : evs.filter((e) => String(e.set) === String(S.statSet));
    const st = computeStats(filt);
    let h = '<section class="panel" aria-label="Løpende statistikk"><div class="panel-head"><h2 style="color:var(--fg);font-family:var(--font-display);font-size:22px;letter-spacing:0;text-transform:none">Løpende statistikk</h2>'
      + '<div class="seg" role="group" aria-label="Utvalg"><button data-a="statset" data-v="all" aria-pressed="' + (S.statSet === 'all') + '">Kamp</button>' + sets.map((s) => { const sc = scoreStr((m.setScores || [])[s - 1]); return '<button data-a="statset" data-v="' + s + '" aria-pressed="' + (String(S.statSet) === String(s)) + '">Sett ' + s + (sc ? ' · ' + sc : '') + '</button>'; }).join('') + '</div></div>';

    const recRows = Object.entries(st.rec).sort((a, b) => b[1].n - a[1].n);
    h += '<div class="stats-body"><div class="stat-block"><div class="label" style="color:var(--accent)">Mottak</div>';
    if (!recRows.length) h += '<div class="empty">Ingen mottak registrert.</div>';
    else h += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Spiller</th><th>Ant.</th><th>Snitt</th><th>Feil</th><th>Spillbart</th><th>Perfekt</th></tr></thead><tbody>'
      + recRows.map(([id, r]) => '<tr><td class="key">' + esc(pname(id)) + '</td><td>' + r.n + '</td><td class="key">' + dec(r.s / r.n) + '</td><td>' + pct(r.c0, r.n) + '</td><td>' + pct(r.c1, r.n) + '</td><td>' + pct(r.c2, r.n) + '</td></tr>').join('')
      + '<tr class="total"><td>Lag</td><td>' + st.tRec.n + '</td><td>' + dec(st.tRec.s / st.tRec.n) + '</td><td>' + pct(st.tRec.c0, st.tRec.n) + '</td><td>' + pct(st.tRec.c1, st.tRec.n) + '</td><td>' + pct(st.tRec.c2, st.tRec.n) + '</td></tr></tbody></table></div>';

    const attRows = Object.entries(st.att).sort((a, b) => b[1].n - a[1].n);
    h += '</div><div class="stat-block"><div class="label" style="color:var(--accent)">Angrep</div>';
    if (!attRows.length) h += '<div class="empty">Ingen angrep registrert.</div>';
    else h += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Spiller</th><th>Ant.</th><th>Poeng</th><th>Feil</th><th>Blokk</th><th>Uttelling</th><th>Snitt</th></tr></thead><tbody>'
      + attRows.map(([id, r]) => '<tr><td class="key">' + esc(pname(id)) + '</td><td>' + r.n + '</td><td>' + r.c2 + '</td><td>' + r.c0 + '</td><td>' + r.B + '</td><td>' + pct(r.c2, r.n) + '</td><td class="key">' + dec(1 + (r.c2 - r.c0 - r.B) / r.n) + '</td></tr>').join('')
      + '<tr class="total"><td>Lag</td><td>' + st.tAtt.n + '</td><td>' + st.tAtt.c2 + '</td><td>' + st.tAtt.c0 + '</td><td>' + st.tAtt.B + '</td><td>' + pct(st.tAtt.c2, st.tAtt.n) + '</td><td>' + dec(1 + (st.tAtt.c2 - st.tAtt.c0 - st.tAtt.B) / st.tAtt.n) + '</td></tr></tbody></table></div>';

    const t = st.tSrv;
    h += '</div><div class="stat-block"><div class="label" style="color:var(--accent)">Serve</div><div class="kpis">'
      + '<div class="kpi"><div class="display num">' + t.n + '</div><div class="k">Server</div></div>'
      + '<div class="kpi"><div class="display num">' + t.E + '</div><div class="k">Ess · ' + pct(t.E, t.n) + '</div></div>'
      + '<div class="kpi"><div class="display num">' + t.F + '</div><div class="k">Feil · ' + pct(t.F, t.n) + '</div></div>'
      + '<div class="kpi"><div class="display num">' + pct(t.n - t.F, t.n) + '</div><div class="k">I spill eller ess</div></div></div>';
    const srvRows = Object.entries(st.srv).sort((a, b) => b[1].n - a[1].n);
    if (srvRows.length) h += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Spiller</th><th>Ant.</th><th>Ess</th><th>Feil</th><th>Ess %</th><th>Feil %</th></tr></thead><tbody>'
      + srvRows.map(([id, r]) => '<tr><td class="key">' + esc(pname(id)) + '</td><td>' + r.n + '</td><td>' + r.E + '</td><td>' + r.F + '</td><td>' + pct(r.E, r.n) + '</td><td>' + pct(r.F, r.n) + '</td></tr>').join('') + '</tbody></table></div>';

    const oppRows = Object.entries(st.opp).sort((a, b) => (a[1].s / a[1].n) - (b[1].s / b[1].n) || b[1].n - a[1].n);
    const weakOpp = (oppRows.find(([, r]) => r.n >= 5) || [])[0];
    h += '</div><div class="stat-block"><div class="label" style="color:var(--opp)">' + esc(oppName) + ' mottak · svakest først</div>';
    if (!oppRows.length) h += '<div class="empty">Ingen motstandermottak registrert.</div>';
    else h += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Nr</th><th>Ant.</th><th>Snitt</th><th>Feil</th><th>Perfekt</th></tr></thead><tbody>'

  // Tabell: CEV-poeng (3–0/3–1 gir 3, 3–2 gir 2, 2–3 gir 1), så seire, poeng, settkvotient og ballkvotient
  function tableMatches() {
    return S.matches.filter((m) => m.stage !== 'sluttspill' && !isSlot(m.home) && !isSlot(m.away) && !isTest(m) && (!m.custom || m.type === 'turnering' || m.type === 'serie'));
  }
  function standings() {
    const T = {}; const row = (t) => (T[t] ||= { team: t, k: 0, v: 0, tap: 0, p: 0, sv: 0, st: 0, bv: 0, bt: 0 });
    tableMatches().forEach((m) => {
      row(m.home); row(m.away);
      if (m.status !== 'ferdig' || !(m.setsHome + m.setsAway)) return;
      const H = row(m.home), A = row(m.away), hs = m.setsHome || 0, as = m.setsAway || 0;
      H.k++; A.k++; H.sv += hs; H.st += as; A.sv += as; A.st += hs;
      (m.setScores || []).forEach(([x, y]) => { H.bv += x; H.bt += y; A.bv += y; A.bt += x; });
      const win = hs > as ? H : A, lose = hs > as ? A : H, close = Math.min(hs, as) === 2;
      win.v++; lose.tap++; win.p += close ? 2 : 3; lose.p += close ? 1 : 0;
    });
    const q = (a, b) => b ? a / b : (a ? Infinity : 0);
    return Object.values(T).sort((a, b) => b.v - a.v || b.p - a.p || q(b.sv, b.st) - q(a.sv, a.st) || q(b.bv, b.bt) - q(a.bv, a.bt) || a.team.localeCompare(b.team, 'nb'));
  }
  function tableView() {
    const st = standings(), q = (a, b) => b ? (Math.round(a / b * 1000) / 1000).toFixed(3).replace('.', ',') : (a ? 'MAX' : '–');
    const all = tableMatches(), done = all.filter((m) => m.status === 'ferdig').length;
    let h = '<header class="bar"><button class="link" data-a="back">‹ Kamper</button><div class="title"><span class="display">Tabell</span><span class="sub">' + esc(CTX.name) + ' · ' + done + ' av ' + all.length + ' kamper spilt</span></div><span class="spacer"></span></header>';
    h += '<section class="panel"><div class="tbl-wrap"><table class="tbl standings"><thead><tr><th>#</th><th class="l-al">Lag</th><th>K</th><th>V</th><th>T</th><th>Poeng</th><th>Sett</th><th class="hide-sm">Settkv.</th><th class="hide-sm">Ballkv.</th></tr></thead><tbody>'
      + st.map((r, i) => '<tr' + (r.team === OUR ? ' class="us"' : '') + '><td>' + (i + 1) + '</td><td class="key l-al">' + esc(shortName(r.team)) + '</td><td>' + r.k + '</td><td>' + r.v + '</td><td>' + r.tap + '</td><td class="key">' + r.p + '</td><td>' + r.sv + '–' + r.st + '</td><td class="hide-sm">' + q(r.sv, r.st) + '</td><td class="hide-sm">' + q(r.bv, r.bt) + '</td></tr>').join('')
      + '</tbody></table></div><div class="code-legend">Rangering: seire, poeng (3–0 og 3–1 gir 3 poeng, 3–2 gir 2 og 2–3 gir 1), settkvotient, ballkvotient.</div></section>';
    const po = S.matches.filter((m) => m.stage === 'sluttspill' || isSlot(m.home) || isSlot(m.away));
    if (po.length) h += '<section class="panel"><div class="panel-head"><h2>Sluttspill</h2></div><div class="po">' + po.map((m) => {
      const slot = (t) => { if (!isSlot(t)) return esc(t); const r = st[parseInt(t, 10) - 1]; return esc(t) + (r && r.k ? ' <span class="muted">(nå: ' + esc(shortName(r.team)) + ')</span>' : ''); };
      return '<button class="po-card" data-a="open" data-id="' + esc(m.id) + '"><span class="label">' + esc(m.round || 'Sluttspill') + ' · ' + esc(fmtDate(m.date)) + (m.venue ? ' · ' + esc(m.venue) : '') + '</span><span class="po-teams">' + slot(m.home) + ' – ' + slot(m.away) + '</span><span class="po-res">' + (m.status === 'ferdig' ? (m.setsHome || 0) + '–' + (m.setsAway || 0) + (setList(m) ? ' <small>(' + esc(setList(m)) + ')</small>' : '') : 'Ikke spilt') + '</span></button>';
    }).join('') + '</div></section>';
    const days = {}; all.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '')).forEach((m) => { const d = (m.date || '').slice(0, 10); (days[d] ||= []).push(m); });
    h += '<section class="panel"><div class="panel-head"><h2>Kamper</h2><span class="status">Trykk en kamp for å registrere resultat eller føre statistikk</span></div><div class="rounds">'
      + Object.entries(days).map(([d, list]) => '<section class="round"><h2 class="label">' + esc(fmtDate(d)) + '</h2>' + list.map(matchRow).join('') + '</section>').join('') + '</div></section>';
    return h;
  }

    try { await S.db.doc(PFX + 'opponents/' + id).set({ name: team, players }); }

    if (!S.db || !m) return;
    try {
      const logs = await S.db.collection(PFX + 'matches/' + m.id + '/log').get();
      for (const d of logs.docs) await S.db.doc(PFX + 'matches/' + m.id + '/log/' + d.id).delete();

      closeSeasonLogs(); openLogs(null); S.view = 'list'; S.matchId = null; render(); toTop();
    } catch (e) { S.error = 'Kampen ble ikke slettet (' + e.code + ').'; render(); }
  }

  function loadScript(src) {

  async function exportXlsx(m, btn) {
    if (!S.dl) { S.error = 'Nedlasting er ikke tilgjengelig i denne visningen.'; render(); return; }
    const old = btn.textContent; btn.textContent = 'Lager Excel …'; btn.disabled = true;
    try {
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js');
      const oppName = m.home === usName(m) ? m.away : m.home;
      const evs = allEvents();
      const maxSet = Math.max(5, ...evs.map((e) => e.set || 1));
      const sets = Array.from({ length: maxSet }, (_, i) => i + 1);
      const byType = (type) => evs.filter((e) => e.type === type);
      const order = (ids) => { const r = teamRoster(m).map((p) => p.id).filter((id) => ids.includes(id)); ids.forEach((id) => { if (!r.includes(id)) r.push(id); }); return r; };
      const sections = [
        { title: 'Mottak', type: 'rec', ids: order([...new Set(byType('rec').map((e) => e.p).concat(m.receivers || []))]), label: pname, heads: ['Antall', 'Poeng', 'Snitt'], kind: 'num' },
        { title: 'Angrep', type: 'att', ids: order([...new Set(byType('att').map((e) => e.p).concat(m.onCourt || []))]), label: pname, heads: ['Antall', 'Poeng', 'Snitt'], kind: 'num' },
        { title: 'Serve (F feil · I i spill · E ess)', type: 'srv', ids: order([...new Set(byType('srv').map((e) => e.p).concat(m.onCourt || []))]), label: pname, heads: ['Antall', 'Ess', 'Feil'], kind: 'srv' },
        { title: oppName + ' mottak', type: 'opp', ids: [...new Set(byType('opp').map((e) => String(e.p)).concat(m.oppNumbers || []))].sort((a, b) => Number(a) - Number(b)), label: (n) => oppLabel(m, n), heads: ['Antall', 'Poeng', 'Snitt'], kind: 'num' }
      ];
      // Felles kolonnebredde per sett: flest koder én spiller har i det settet, minst 6, pluss to ledige for manuell føring
      const width = {};
      sets.forEach((n) => {
        let mx = 6;
        sections.forEach((sec) => sec.ids.forEach((id) => { const c = byType(sec.type).filter((e) => String(e.p) === String(id) && e.set === n).length; if (c + 2 > mx) mx = c + 2; }));
        width[n] = mx;
      });
      const start = {}; let col = 2;
      sets.forEach((n) => { start[n] = col; col += width[n]; });
      const tCol = col; const lastCol = tCol + 2;

      const wb = new window.ExcelJS.Workbook();
      const ws = wb.addWorksheet('Kampark', { views: [{ state: 'frozen', xSplit: 1 }], pageSetup: { orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0, paperSize: 9 } });
      ws.getColumn(1).width = 14;
      for (let c = 2; c < tCol; c++) ws.getColumn(c).width = 3.3;
      for (let c = tCol; c <= lastCol; c++) ws.getColumn(c).width = 9;
      const fill = (argb) => ({ type: 'pattern', pattern: 'solid', fgColor: { argb } });
      const thin = { style: 'thin', color: { argb: 'FF333333' } };
      const setFill = (n) => fill(n % 2 ? 'FFD9D9D9' : 'FF70AD47');
      const L = (c) => ws.getColumn(c).letter;

      const d = m.date ? new Date(m.date) : null;
      const dstr = d && !isNaN(d) ? ' ' + d.getDate() + '/' + (d.getMonth() + 1) + '-' + String(d.getFullYear()).slice(2) : '';
      const titleEnd = Math.max(2, start[Math.min(3, maxSet)] - 1);
      ws.mergeCells(1, 1, 1, titleEnd);
      const tc = ws.getCell(1, 1); tc.value = m.home + ' - ' + m.away + dstr; tc.font = { bold: true, italic: true, color: { argb: 'FFFFFFFF' }, size: 14 }; tc.fill = fill('FF000000'); tc.alignment = { horizontal: 'center' };
      ['0 Feil (blokkert = rød 0)', '1 Spill videre', '2 Perfekt / poeng'].forEach((t, i) => { const c = ws.getCell(1 + i, titleEnd + 2); c.value = t; c.font = { bold: true, color: { argb: 'FFC00000' } }; });
      ws.getCell(3, 1).value = 'Resultat: ' + (m.setsHome || 0) + '-' + (m.setsAway || 0) + (setList(m) ? ' (' + setList(m).replace(/–/g, '-') + ')' : '');

      let r = 5;
      sections.forEach((sec) => {
        ws.mergeCells(r, 2, r, lastCol);
        const b = ws.getCell(r, 2); b.value = sec.title; b.fill = fill('FF9DC3E6'); b.font = { bold: true, italic: true }; b.alignment = { horizontal: 'center' };
        r++;
        sets.forEach((n) => { ws.mergeCells(r, start[n], r, start[n] + width[n] - 1); const c = ws.getCell(r, start[n]); const scx = scoreStr((m.setScores || [])[n - 1]); c.value = n + '. sett' + (scx ? ' (' + scx.replace('–', '-') + ')' : ''); c.font = { bold: true }; for (let k = 0; k < width[n]; k++) ws.getCell(r, start[n] + k).fill = setFill(n); });
        sec.heads.forEach((h, i) => { const c = ws.getCell(r, tCol + i); c.value = h; c.font = { bold: true }; c.fill = fill('FFFFE699'); c.border = { top: thin, left: thin, bottom: thin, right: thin }; c.alignment = { horizontal: 'center' }; });
        r++;
        const ids = sec.ids.length ? sec.ids : [null];
        ids.forEach((id) => {
          ws.getCell(r, 1).value = id == null ? '' : sec.label(id); ws.getCell(r, 1).alignment = { horizontal: 'right' };
          sets.forEach((n) => {
            for (let k = 0; k < width[n]; k++) ws.getCell(r, start[n] + k).fill = setFill(n);
            if (id == null) return;
            byType(sec.type).filter((e) => String(e.p) === String(id) && e.set === n).forEach((e, k) => {
              const c = ws.getCell(r, start[n] + k);
              if (sec.kind === 'srv') { c.value = e.c; if (e.c === 'F') c.font = { color: { argb: 'FFC00000' }, bold: true }; if (e.c === 'E') c.font = { color: { argb: 'FF1F6B2E' }, bold: true }; }
              else if (e.c === 'B') { c.value = 0; c.font = { color: { argb: 'FFC00000' } }; }
              else c.value = Number(e.c);
              c.alignment = { horizontal: 'center' };
            });
          });
          const rng = L(2) + r + ':' + L(tCol - 1) + r;
          const f = sec.kind === 'srv'
            ? ['COUNTA(' + rng + ')', 'COUNTIF(' + rng + ',"E")', 'COUNTIF(' + rng + ',"F")']
            : ['COUNT(' + rng + ')', 'SUM(' + rng + ')', 'IF(' + L(tCol) + r + '=0,"",' + L(tCol + 1) + r + '/' + L(tCol) + r + ')'];
          f.forEach((fx, i) => { const c = ws.getCell(r, tCol + i); c.value = { formula: fx }; c.fill = fill('FFFFE699'); c.border = { top: thin, left: thin, bottom: thin, right: thin }; if (i === 2 && sec.kind !== 'srv') c.numFmt = '0.00'; });
          r++;
        });
        r++;
      });
      const note = ws.getCell(r, 1); note.value = 'Røde 0 i angrep = blokkert. Formlene i de gule kolonnene teller med koder du legger til eller endrer manuelt.'; note.font = { italic: true, color: { argb: 'FF555555' } };

      const buf = await wb.xlsx.writeBuffer();
      const name = ('kampark-' + m.home + '-' + m.away).replace(/[^\wæøåÆØÅ-]+/g, '-') + '.xlsx';
      await S.dl.save({ filename: name, data: new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }) });
    } catch (e) {
      if (!e || e.code !== 'declined') { S.error = 'Excel-filen kunne ikke lages' + (e && e.code ? ' (' + e.code + ')' : '') + '. Prøv igjen.'; }
    }
    btn.textContent = old; btn.disabled = false; if (S.error) render();
  }

  async function exportPdf(m, btn) {
    if (!S.dl) { S.error = 'Nedlasting er ikke tilgjengelig i denne visningen.'; render(); return; }
    const old = btn.textContent; btn.textContent = 'Lager PDF …'; btn.disabled = true;
    try {
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
      const el = document.getElementById('sk-sheet');
      const canvas = await window.html2canvas(el, { scale: 2, backgroundColor: '#FFFFFF', windowWidth: el.scrollWidth });
      const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
      const W = 297 - 16, H = 210 - 16;
      const ratio = Math.min(W / canvas.width, H / canvas.height);

  // Mottakssnitt (0–2) for NVBF-kamper, regnet fra antall, feil og perfekt %: perfekt = 2, feil = 0, resten = 1
  function addRecAvg(n) {
    if (!n || !n.teams) return;
    const num = (v) => { const x = parseFloat(String(v ?? '').replace('%', '').replace(',', '.').replace('−', '-')); return isNaN(x) ? null : x; };
    n.teams.forEach((t) => {
      let N = 0, Pf = 0, F = 0;
      (t.players || []).forEach((p) => {
        const perf = num(p.recPerf);
        if (!p.rec || perf == null) return;
        const pn = Math.round(p.rec * perf / 100), f = p.recErr || 0;
        if (p.recAvg == null) p.recAvg = dec((2 * pn + (p.rec - pn - f)) / p.rec);
        N += p.rec; Pf += pn; F += f;
      });
      if (N) { t.totals = t.totals || {}; if (t.totals.recAvg == null) t.totals.recAvg = dec((2 * Pf + (N - Pf - F)) / N); }
    });
  }

  // Egen føring samlet i samme form som NVBF-statistikken, til visningsmodus for avsluttede kamper
  function ownStats(m, evs) {
    const E = evs.filter((e) => e.type === 'rec' || e.type === 'att' || e.type === 'srv' || e.type === 'opp');
    if (!E.length) return null;
    const cnt = (a, v) => a.filter((x) => x === v).length;
    const avg = (a) => a.length ? dec(a.reduce((s, x) => s + (Number(x) || 0), 0) / a.length) : undefined;
    const sp = {}; const get = (id) => (sp[id] ||= { id, rec: [], att: [], srv: [] });
    E.forEach((e) => { if (e.type !== 'opp') get(e.p)[e.type].push(String(e.c)); });
    const inServe = E.some((e) => e.type === 'srv' && String(e.c) === 'I');
    const ord = teamRoster(m).map((p) => p.id); const ix = (id) => { const i = ord.indexOf(id); return i < 0 ? 999 : i; };
    const T = { rec: [], att: [], srv: [] };
    const players = Object.values(sp).sort((a, b) => ix(a.id) - ix(b.id)).map((p) => {
      const pl = player(p.id) || {}; const o = { nr: pl.nr || '', name: pl.name || pname(p.id) };
      if (p.rec.length) Object.assign(o, { rec: p.rec.length, recErr: cnt(p.rec, '0'), recAvg: avg(p.rec), recPerf: pct(cnt(p.rec, '2'), p.rec.length) });
      if (p.att.length) { const k = cnt(p.att, '2'); Object.assign(o, { att: p.att.length, kills: k, attErr: cnt(p.att, '0'), blocked: cnt(p.att, 'B'), kp: pct(k, p.att.length) }); }
      if (p.srv.length || p.att.length) { Object.assign(o, { aces: cnt(p.srv, 'E'), srvErr: cnt(p.srv, 'F'), pts: cnt(p.att, '2') + cnt(p.srv, 'E') }); if (inServe) o.srv = p.srv.length; }
      T.rec.push(...p.rec); T.att.push(...p.att); T.srv.push(...p.srv);
      return o;
    });
    const k = cnt(T.att, '2'), f = cnt(T.att, '0'), b = cnt(T.att, 'B');
    const totals = { recAvg: avg(T.rec), recPerf: T.rec.length ? pct(cnt(T.rec, '2'), T.rec.length) : undefined, aces: cnt(T.srv, 'E'), srvErr: cnt(T.srv, 'F'), pts: k + cnt(T.srv, 'E') };
    if (T.att.length) Object.assign(totals, { kp: pct(k, T.att.length), eff: pct1(k - f - b, T.att.length) });
    if (inServe) totals.srv = T.srv.length;
    const oppName = m.home === usName(m) ? m.away : m.home;
    const oppr = {};
    E.forEach((e) => { if (e.type === 'opp') (oppr[String(e.p)] ||= []).push(String(e.c)); });
    const opp = { name: oppName, players: [], totals: {} };
    const nums = Object.keys(oppr).sort((a, b) => Number(a) - Number(b));
    if (nums.length) {
      const all = nums.flatMap((n) => oppr[n]);
      opp.players = nums.map((n) => ({ nr: n, name: (oppP(m, n) || {}).name || '', rec: oppr[n].length, recErr: cnt(oppr[n], '0'), recAvg: avg(oppr[n]), recPerf: pct(cnt(oppr[n], '2'), oppr[n].length) }));
      opp.totals = { recAvg: avg(all), recPerf: pct(cnt(all, '2'), all.length) };
    } else opp.missing = 'Motstanderens mottak ble ikke ført i denne kampen.';
    return { source: 'egen', teams: [{ name: usName(m), players, totals }, opp] };
  }

    h += '<div class="rounds">' + n.teams.map((t) => {

      if (k.length) s += '<div class="kpis">' + k.map((x) => '<div class="kpi"><div class="display num">' + esc(x[1]) + '</div><div class="k">' + esc(x[0]) + '</div></div>').join('') + '</div>';

      if (pr.length) s += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Mottak</th><th>Ant.</th><th>Feil</th><th>Snitt</th>' + (egen ? '' : '<th>Pos.</th>') + '<th>Perf.</th></tr></thead><tbody>' + pr.map((p) => '<tr' + (p === weak ? ' class="weakest"' : '') + '><td class="key">' + esc(p.nr ? '#' + p.nr + ' ' : '') + esc(p.name) + (p === weak ? ' <span class="weak-tag">Svakest</span>' : '') + '</td><td>' + p.rec + '</td><td>' + (p.recErr ?? '–') + '</td><td class="key">' + esc(p.recAvg ?? '–') + '</td>' + (egen ? '' : '<td>' + esc(p.recPos ?? '–') + '</td>') + '<td>' + esc(p.recPerf ?? '–') + '</td></tr>').join('') + '</tbody></table></div>';
      if (weak) s += '<div class="code-legend"><span class="weak-tag">Svakest</span> lavest mottakssnitt blant spillere med minst ' + minRec + ' mottak.</div>';
      const pa = (t.players || []).filter((p) => p.att != null).sort((a, b) => b.att - a.att);
      if (pa.length) s += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Angrep</th><th>Fors.</th><th>Poeng</th><th>Feil</th><th>Blokk.</th><th>Utt.</th><th>Snitt</th></tr></thead><tbody>' + pa.map((p) => '<tr><td class="key">' + esc(p.nr ? '#' + p.nr + ' ' : '') + esc(p.name) + '</td><td>' + p.att + '</td><td>' + p.kills + '</td><td>' + p.attErr + '</td><td>' + p.blocked + '</td><td>' + esc(p.kp ?? pct(p.kills, p.att)) + '</td><td class="key">' + (p.att ? dec(1 + (p.kills - p.attErr - p.blocked) / p.att) : '–') + '</td></tr>').join('') + '</tbody></table></div>';
