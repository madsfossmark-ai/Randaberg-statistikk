<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Statistikk Randaberg</title>
<meta name="claude:viewport-fit-sides" content="cover">

<meta name="apple-mobile-web-app-title" content="Kampstatistikk">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: benk-verktøy, iPad liggende først – tre kolonner (registrering | registrering | løpende tall), stables på smal skjerm */
:root {
  --bg: #F2F1EC; --surface: #FFFFFF; --sunk: #E7E5DE; --line: #D9D6CD;
  --fg: #16181D; --muted: #4A4F5A; --faint: #6B7080;
  --accent: #1B4592; --accent-soft: #DCE4F5; --accent-fg: #FFFFFF; --accent-ink: #122F66; --accent-bar: #2F63C4; --hero: #1B4592;
  --opp: #8A3E0F; --opp-soft: #F5DFCF; --opp-strong: #C85E1C;
  --bad: #B3261E; --block: #7A1A14; --neutral: #5C6270; --good: #1F7A4D;
  --bar: #16181D; --bar-fg: #FFFFFF; --bar-muted: #B8BCC6;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121418; --surface: #1C1F25; --sunk: #262A32; --line: #343944;
  --fg: #ECEDEF; --muted: #A7ADB8; --faint: #8E94A0;
  --accent: #7FA3E8; --accent-soft: #23314F; --accent-fg: #0E1424;
  --opp: #F0A774; --opp-soft: #3A2A1F; --opp-strong: #D9773A;
  --bad: #D9473E; --block: #9C2B23; --neutral: #6A7180; --good: #2E9963;
  --bar: #0B0C0F; --bar-fg: #FFFFFF; --bar-muted: #A7ADB8; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121418; --surface: #1C1F25; --sunk: #262A32; --line: #343944;
  --fg: #ECEDEF; --muted: #A7ADB8; --faint: #8E94A0;
  --accent: #7FA3E8; --accent-soft: #23314F; --accent-fg: #0E1424;
  --opp: #F0A774; --opp-soft: #3A2A1F; --opp-strong: #D9773A;
  --bad: #D9473E; --block: #9C2B23; --neutral: #6A7180; --good: #2E9963;
  --bar: #0B0C0F; --bar-fg: #FFFFFF; --bar-muted: #A7ADB8; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px;
  -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.display { font-family: var(--font-display); font-weight: 700; line-height: 1; }

.app { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

/* Topplinje */
.bar { background: var(--bar); color: var(--bar-fg); border-radius: 14px; padding: 10px 14px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.bar a, .bar .link { color: #C9D6F0; text-decoration: none; background: none; border: 0; padding: 8px 4px; font-size: 14px; }
.bar .title { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.bar .title .display { font-size: 24px; }
.bar .sub { font-size: 12px; color: var(--bar-muted); }
.spacer { flex: 1; }
.score { display: flex; align-items: center; gap: 8px; }
.score .team { font-size: 13px; color: var(--bar-muted); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score .pts { font-family: var(--font-display); font-size: 40px; font-weight: 700; min-width: 50px; text-align: center; }
.sbtn { width: 46px; height: 46px; border-radius: 10px; border: 1px solid #3A3F49; background: transparent; color: #FFFFFF; font-size: 22px; }
.sbtn.plus-us { background: var(--accent-bar); border-color: var(--accent-bar); }
.sbtn.plus-them { background: var(--opp-strong); border-color: var(--opp-strong); }
.barbtn { height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #3A3F49; background: transparent; color: #FFFFFF; font-weight: 600; font-size: 14px; }
.sets { font-family: var(--font-display); font-size: 18px; color: var(--bar-muted); }

/* Generelle flater */
.panel { background: var(--surface); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.panel-head h2 { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.panel.opp .panel-head h2 { color: var(--opp); }
.textbtn { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 13px; padding: 8px 0; }
.empty { font-size: 13px; color: var(--muted); padding: 6px 0; }

.score-wrap { display: flex; align-items: center; gap: 18px; }
.setpill { font-family: var(--font-display); font-weight: 700; font-size: 30px; padding: 2px 14px; border-radius: 10px; background: #2A2E37; }
.barbtn.primary-bar { background: var(--accent-bar); border-color: var(--accent-bar); }
.setform { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.setin { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--bar-muted); }
.setin input { width: 64px; height: 46px; box-sizing: border-box; border: 1px solid #3A3F49; border-radius: 10px; background: #2A2E37; color: #FFFFFF; text-align: center; font-family: var(--font-display); font-size: 26px; font-weight: 700; }
.setform .dash { font-family: var(--font-display); font-size: 26px; color: var(--bar-muted); padding-top: 14px; }
.sk .sk-sc { font-weight: 500; margin-left: 6px; }
.barbtn.win { background: var(--good); border-color: var(--good); }
.barbtn.lose { background: var(--opp-strong); border-color: var(--opp-strong); }
.bar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Registrering: én rad per spiller, ett trykk. Mobil: alt stablet. Nettbrett: registrering side om side, tall under. Bred iPad: tre kolonner på én skjerm */
.live-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-items: start; }
.sa-head, .sa-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px 12px; align-items: center; }
.sa-head .label:not(:first-child) { text-align: center; }
.step { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 99px; background: var(--accent); color: var(--accent-fg); font-size: 11px; margin-right: 6px; letter-spacing: 0; }
.panel.opp .step { background: var(--opp-strong); color: #FFFFFF; }
.sa-grp { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.stat-block { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.stats-body { display: flex; flex-direction: column; gap: 14px; }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.who { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "nr nm" "nr mini"; column-gap: 10px; align-items: center; min-width: 0; }
.who .nr { grid-area: nr; }
.who .nm { grid-area: nm; align-self: end; }
.who .mini { grid-area: mini; align-self: start; }
.who .mini:empty { display: none; }
.who:not(:has(.nm)) .mini { grid-row: 1 / span 2; align-self: center; }
.nr { flex: none; width: 36px; height: 36px; box-sizing: border-box; border-radius: 50%; background: var(--hero); color: #FFFFFF; box-shadow: inset 0 0 0 2px rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1; font-variant-numeric: tabular-nums; }
.nr.opp { background: var(--opp-strong); }
.nm { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.mini { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.codes { display: flex; gap: 6px; }
.code { width: 52px; height: 48px; border: 0; border-radius: 10px; color: #FFFFFF; font-family: var(--font-display); font-weight: 700; font-size: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; transition: transform .08s; }
.code small { font-family: var(--font-body); font-size: 10px; font-weight: 500; margin-top: 2px; }
.code:active { transform: scale(.94); }
.c-bad { background: var(--bad); } .c-block { background: var(--block); } .c-mid { background: var(--neutral); } .c-good { background: var(--good); }
.code.flash { box-shadow: 0 0 0 4px var(--accent); }
.code-legend { font-size: 12px; color: var(--muted); }
.addopp { display: flex; gap: 6px; }
.addopp input { width: 90px; height: 44px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 0 10px; font-size: 16px; }
.addopp button { height: 44px; padding: 0 12px; border-radius: 10px; border: 1px dashed var(--opp); background: var(--surface); color: var(--opp); font-weight: 600; }

/* Siste registreringer */
.lastbar { background: var(--surface); border-radius: 14px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
.chip { font-size: 13px; padding: 6px 10px; border-radius: 99px; background: var(--sunk); }
.chip.first { background: var(--accent-soft); font-weight: 600; }
.undo { height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--bad); background: var(--surface); color: var(--bad); font-weight: 600; }
.undo:disabled { opacity: .4; cursor: default; }

/* Statistikk */
.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.seg button { height: 34px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.tbl th { font-size: 11px; font-weight: 500; color: var(--muted); text-align: right; padding: 2px 4px 4px; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl td { text-align: right; padding: 4px; border-top: 1px solid var(--sunk); }
.tbl tr.total td { font-weight: 700; border-top: 1px solid var(--line); }
.tbl td.key { font-weight: 600; }
.tbl td:not(:first-child):not(.l-al) { white-space: nowrap; }
@media (max-width: 640px) {
  .tbl .hide-sm { display: none; }
  .t-games th:nth-child(5), .t-games td:nth-child(5), .t-games th:nth-child(n+7):nth-child(-n+9), .t-games td:nth-child(n+7):nth-child(-n+9) { display: none; }
  .t-players th:nth-child(2), .t-players td:nth-child(2), .t-players th:nth-child(5), .t-players td:nth-child(5), .t-players th:nth-child(8), .t-players td:nth-child(8), .t-players th:nth-child(n+9), .t-players td:nth-child(n+9) { display: none; }
  .t-att th:nth-child(7), .t-att td:nth-child(7) { display: none; }
  .tbl { font-size: 14px; }
  .lastbar .chip:nth-child(n+4) { display: none; }
  .kk-controls { flex-direction: column; align-items: stretch; }
  .kk-controls .seg { flex: none; }
  .kk-controls .kk-pick { width: 100%; align-items: stretch; }
  .listhead > div:first-child, .lh-id, .lh-id > div { min-width: 0; max-width: 100%; }
  .ctx-pick, .ctx-pick select { max-width: 100%; }
  .ctx-pick select { text-overflow: ellipsis; overflow: hidden; white-space: nowrap; width: 100%; }
  .listhead h1 { font-size: 34px; }
  .listhead .primary, .listhead .secondary { height: 42px; padding: 0 14px; }
  .tabs button { height: 34px; padding: 0 12px; }
  .next { padding: 14px 16px; gap: 10px; }
  .next .crest.img.lg { width: 44px; height: 44px; }
  .det-bar .display { font-size: 21px; }
}
.tbl-wrap { overflow-x: auto; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.kpi { background: var(--sunk); border-radius: 8px; padding: 6px 8px; }
.kpi .display { font-size: 22px; }
.kpi .k { font-size: 11px; color: var(--muted); }
.warn { color: var(--bad); }
.small-n { color: var(--faint); }

/* Kampliste */
.listhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.listhead .lh-id { flex: 1 1 auto; min-width: 0; }
.listhead .menu-wrap { flex: none; }
.list-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
@media (max-width: 640px) { .menu-btn span { display: none; } .menu-btn { padding: 0 12px; } }
.listhead h1 { font-family: var(--font-display); font-size: 40px; font-weight: 700; line-height: 1; }
.tabs { display: inline-flex; gap: 4px; background: var(--sunk); padding: 4px; border-radius: 10px; }
.tabs button { height: 38px; padding: 0 16px; border: 0; border-radius: 7px; background: transparent; font-weight: 500; }
.tabs button[aria-pressed="true"] { background: var(--surface); font-weight: 600; }
.primary { height: 46px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.secondary { height: 46px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--accent); background: var(--surface); color: var(--accent); font-weight: 600; }
.next { background: var(--hero); color: #FFFFFF; border-radius: 16px; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
.next .nx-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; }
.next .nx-top .label { color: inherit; opacity: .85; }
.next .nx-teams { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px; }
.next .nx-team { display: flex; align-items: center; gap: 14px; min-width: 0; }
.next .nx-team.r { justify-content: flex-end; text-align: right; }
.next .nx-team .display { font-size: 32px; min-width: 0; }
.next .nx-vs { font-family: var(--font-display); font-weight: 700; font-size: 20px; opacity: .75; }
.next .nx-foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
@media (max-width: 640px) { .next .nx-teams { grid-template-columns: minmax(0, 1fr); gap: 10px; } .next .nx-vs { display: none; } .next .nx-team.r { flex-direction: row-reverse; justify-content: flex-end; text-align: left; } .next .nx-team .display { font-size: 24px; } .next .crest.lg { width: 40px; height: 47px; font-size: 17px; } .next .flag.lg { width: 48px; height: 32px; } }
.next .display { font-size: 30px; }
.next .meta { font-size: 13px; opacity: .85; }
.next button { height: 48px; padding: 0 18px; border: 0; border-radius: 10px; background: #FFFFFF; color: var(--hero); font-weight: 600; }
.rounds { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; align-items: start; }
.round { display: flex; flex-direction: column; gap: 6px; }
.match { display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; background: var(--sunk); border: 0; border-radius: 10px; padding: 7px 12px; min-height: 46px; color: var(--muted); }
.match.ours { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--line); border-radius: 12px; padding: 10px 12px; min-height: 58px; }
.match .tn { display: flex; align-items: center; gap: 7px; }
.match .tn .nmx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.match .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.match .tn { font-size: 14px; white-space: nowrap; overflow: hidden; }
.match.ours .tn { font-weight: 600; font-size: 15px; }
.match:not(.ours) .res { font-size: 18px; }
.match .d { font-size: 12px; color: var(--muted); }
.match .res { font-family: var(--font-display); font-size: 22px; font-weight: 700; }
.badge { font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 99px; white-space: nowrap; }
.b-own { background: var(--accent-soft); color: var(--accent); }
.b-nvbf { background: var(--sunk); color: var(--muted); }
.b-live { background: var(--good); color: #FFFFFF; }
.b-win { background: var(--accent); color: var(--accent-fg); text-transform: uppercase; letter-spacing: .04em; padding: 4px 9px; }
.b-loss { background: transparent; color: var(--opp); box-shadow: inset 0 0 0 1.5px var(--opp); text-transform: uppercase; letter-spacing: .04em; padding: 4px 9px; }
/* Lagmerker: klubblogo når den er lastet opp, ellers skjold med forbokstaver. Landslag: flagg */
.crest { flex: none; display: inline-flex; align-items: center; justify-content: center; color: #FFFFFF; font-family: var(--font-display); font-weight: 700; line-height: 1; box-shadow: inset 0 0 0 2px rgba(255,255,255,.3); }
.crest.sh { border-radius: 22% 22% 50% 50% / 18% 18% 42% 42%; }
.crest.slot { background: var(--sunk); color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--line); }
.crest.img { background: #FFFFFF; border-radius: 50%; box-shadow: 0 0 0 1px rgba(22,24,29,.14); box-sizing: border-box; }
.crest.img img { width: 76%; height: 76%; object-fit: contain; display: block; border-radius: 3px; }
.crest.img.xs { width: 20px; height: 20px; } .crest.img.sm { width: 28px; height: 28px; } .crest.img.md { width: 42px; height: 42px; } .crest.img.lg { width: 68px; height: 68px; }
.next .crest.img.lg, .board .crest.img.lg { box-shadow: 0 0 0 3px rgba(255,255,255,.25); }
.crest.xs { width: 16px; height: 19px; font-size: 8px; } .crest.sm { width: 22px; height: 26px; font-size: 10px; } .crest.md { width: 34px; height: 40px; font-size: 15px; } .crest.lg { width: 56px; height: 66px; font-size: 24px; }
.flag { flex: none; position: relative; overflow: hidden; border-radius: 3px; box-shadow: 0 0 0 1px rgba(0,0,0,.18); display: inline-block; }
.flag i { position: absolute; display: block; }
.flag.xs { width: 20px; height: 13px; } .flag.sm { width: 26px; height: 17px; } .flag.md { width: 42px; height: 28px; border-radius: 4px; } .flag.lg { width: 66px; height: 44px; border-radius: 6px; }
.next .crest.lg:not(.img) { box-shadow: inset 0 0 0 3px rgba(255,255,255,.45); }
.next .flag.lg { box-shadow: 0 0 0 2px rgba(255,255,255,.6); }
.lh-id { display: flex; align-items: center; gap: 12px; }
.tm { display: inline-flex; align-items: center; gap: 8px; min-width: 0; vertical-align: middle; }
/* Resultattavle i live-visningen */
.board { background: var(--bar); color: var(--bar-fg); border-radius: 18px; padding: 14px 20px 18px; display: flex; flex-direction: column; gap: 12px; }
.board .b-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.board .b-top .link { color: #C9D6F0; background: none; border: 0; padding: 8px 4px; font-size: 14px; }
.board .b-top .sub { font-size: 13px; color: var(--bar-muted); }
.board .b-mid { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 20px; }
.board .b-team { display: flex; align-items: center; gap: 14px; min-width: 0; }
.board .b-team.r { justify-content: flex-end; text-align: right; }
.board .b-team .display { font-size: 34px; }
.board .b-team .sw { font-size: 13px; color: var(--bar-muted); }
.board .b-score { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.board .b-score .label { color: var(--bar-muted); }
.board .b-pts { font-family: var(--font-display); font-weight: 700; font-size: 72px; line-height: 1; display: flex; align-items: center; gap: 12px; font-variant-numeric: tabular-nums; }
.board .b-pts .sep { font-size: 44px; color: #4A4F5A; }
.board .b-sets { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }

window.PUBLIC = true;
window.PUBLIC_UPDATED = "21.10.2026 kl. 22:34";
window.PUBLIC_CTX = null;
(function () {
  const dataP = fetch('data.json', { cache: 'no-cache' }).then((r) => r.json());
  const colSnap = (pairs) => ({ docs: pairs.map(([id, d]) => ({ id, data: () => d })) });
  const fail = (err) => () => err && err({ code: 'kunne ikke hente data' });
  function collection(path) {
    const p = path.split('/');
    return {
      onSnapshot(cb, err) {
        dataP.then((D) => {
          if (path === 'matches') cb(colSnap(D.matches.map((m) => [m.id, m.data])));
          else if (p[0] === 'matches' && p[2] === 'log') cb(colSnap(Object.entries(D.logs[p[1]] || {})));
          else if (path === 'opponents') cb(colSnap(Object.entries(D.opponents || {})));
          else cb(colSnap([]));
        }).catch(fail(err));
        return () => {};
      },
      add: async () => { throw { code: 'kun lesing' }; }
    };
  }
  function doc(path) {
    return {
      onSnapshot(cb, err) {
        dataP.then((D) => {
          const d = path === 'config/roster' ? { players: D.roster } : path === 'config/logos' && D.logos ? { logos: D.logos } : null;
          cb({ exists: !!d, data: () => d || {} });
        }).catch(fail(err));
        return () => {};
      },
      set: async () => {}, update: async () => {}
    };
  }
  const downloads = {
    async save({ filename, data }) {
      const blob = data instanceof Blob ? data : new Blob([data], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);

  };

})();

  function flagHtml(f, size) {

  // Utfall sett fra vårt lag
  function outcome(m) {

  const POS = ['Opplegger', 'Diagonal', 'Kant', 'Midt', 'Libero'];

  let deviceId = null;

  try { const v = localStorage.getItem('rv-view'); if (v) { const o = JSON.parse(v); S.filter = o.filter === 'vare' ? 'vare' : 'alle'; } } catch (e) {}

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pct = (a, b) => b ? Math.round((a / b) * 100) + ' %' : '–';
  const pct1 = (a, b) => b ? (Math.round((a / b) * 1000) / 10).toString().replace('.', ',') + ' %' : '–';
  const dec = (x) => (Math.round(x * 100) / 100).toFixed(2).replace('.', ',');
  // Snitt (0–2) med søyle: under 1,00 rød, 1,00–1,20 gul, over 1,20 grønn
  const avgNum = (v) => typeof v === 'number' ? v : parseFloat(String(v ?? '').replace('−', '-').replace(',', '.'));
  // Fargegrenser per kjønn: [rød under, grønn over]. Kvinner har lavere angrepseffektivitet enn menn (ca. 0,07–0,10),
  // og litt bedre mottak. Midtspillere har høyere angrepssnitt enn andre. Se «Fargeforklaring» i menyen
  const THRESH = {
    kvinner: { att: [1.10, 1.25], attMidt: [1.15, 1.35], rec: [1.20, 1.40], srv: [0.95, 1.10] },
    menn: { att: [1.15, 1.30], attMidt: [1.25, 1.45], rec: [1.15, 1.35], srv: [0.90, 1.05] }
  };
  const ctxGender = () => CTX.gender === 'menn' || (!CTX.gender && /herre|menn|\bH\d/i.test((CTX.name || '') + ' ' + (CTX.our || ''))) ? 'menn' : 'kvinner';
  const thr = (kind, pos) => { const T = THRESH[ctxGender()]; return kind === 'att' ? (pos === 'Midt' ? T.attMidt : T.att) : kind === 'srv' ? T.srv : T.rec; };
  // Lav og høy: lavest og høyest snitt blant spillere med nok forsøk (mottak og angrep minst 5, serve minst 3). Krever minst to spillere
  const extremes = (obj, f, minN) => { const el = Object.entries(obj).filter(([, r]) => r.n >= minN).sort((a, b) => f(a[1]) - f(b[1]) || b[1].n - a[1].n); return el.length > 1 && f(el[0][1]) !== f(el[el.length - 1][1]) ? { lo: el[0][0], hi: el[el.length - 1][0] } : {}; };
  const loHi = (id, ex) => id === ex.lo ? [' class="weakest"', ' <span class="weak-tag">Lav</span>'] : id === ex.hi ? [' class="strongest"', ' <span class="weak-tag strong">Høy</span>'] : ['', ''];
  // Svakest: lavest snitt blant spillere med nok forsøk (mottak og angrep minst 5, serve minst 3)
  const srvAvg = (r) => 1 + (r.E - r.F) / r.n;
  const weakestOf = (obj, f, minN) => (Object.entries(obj).filter(([, r]) => r.n >= minN).sort((a, b) => f(a[1]) - f(b[1]) || b[1].n - a[1].n)[0] || [])[0];
  const attAvg = (r) => 1 + (r.c2 - r.c0 - r.B) / r.n;
  const avgLvl = (n, kind, pos) => { n = Math.round(n * 100) / 100; const [lo, hi] = thr(kind, pos); return n < lo ? 'lo' : n <= hi ? 'mid' : 'hi'; };
  const posOf = (id) => (player(id) || {}).pos || '';
  const posByNr = (nr) => ((S.roster || []).find((x) => !x.archived && String(x.nr) === String(nr)) || {}).pos || '';
  function avgBarOnly(v, cls, kind, pos) {
    const n = avgNum(v); if (v == null || !isFinite(n)) return '';
    return '<span class="avgbar ' + avgLvl(n, kind, pos) + (cls ? ' ' + cls : '') + '" aria-hidden="true"><i style="width:' + Math.max(3, Math.min(100, n / 2 * 100)) + '%"></i></span>';
  }
  function avgBar(v, txt, kind, pos) {

    return '<span class="avg">' + (txt != null ? txt : dec(n)) + avgBarOnly(n, '', kind, pos) + '</span>';
  }
  const fmtDate = (iso) => { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return iso; return d.toLocaleDateString('nb-NO', { weekday: 'short', day: 'numeric', month: 'short' }) + (iso.length > 10 ? ' · ' + d.toLocaleTimeString('nb-NO', { hour: '2-digit', minute: '2-digit' }) : ''); };
  const isOurs = (m) => m.home === OUR || m.away === OUR;
  const cur = () => S.matches.find((m) => m.id === S.matchId);
  // Spillere på et annet lag (når vi fører statistikk for andres kamper) har id «o:<lag>:<nr>»
  const player = (id) => {
    if (typeof id === 'string' && id.startsWith('o:')) {

    }
    return S.roster.find((p) => p.id === id);
  };
  const EXTRA = { midt: 'Midtspillere' };
  // Navn slik de var da registreringen ble gjort (følger spilleren selv om tropp eller nummer endres senere)
  const NAMEHINT = {}, OPPHINT = {};
  const learnNames = (evs, opp) => evs.forEach((e) => { if (!e.n) return; if (e.type === 'opp' || e.type === 'dir') { if (opp) opp[String(e.p)] = e.n; } else NAMEHINT[e.p] = e.n; });
  const pname = (id) => { const p = player(id); return p ? p.name.split(' ')[0] : NAMEHINT[id] ? NAMEHINT[id].split(' ')[0] : (EXTRA[id] || '?'); };
  // Kamptyper: serie fra terminlisten, eller egne kamper (cup, europacup, trening)

  const TSHORT = { serie: 'Serie', cup: 'Cup', europacup: 'EC', turnering: 'T', trening: 'Tr' };
  const roundLabel = (m) => m.custom ? (m.type === 'turnering' && m.round ? m.round : (TYPES[m.type] || 'Egen kamp') + (m.round ? ' · ' + m.round : '')) : (m.round ? 'Runde ' + m.round : 'Uten runde');
  const roundShort = (m) => m.custom ? (m.short || TSHORT[m.type] || 'Egen') : 'R' + (m.round || '?');
  // Motstanderens tropp lagres per lag og huskes til neste kamp mot samme lag
  const teamSlug = (s) => String(s || '').toLowerCase().replace(/æ/g, 'ae').replace(/ø/g, 'o').replace(/å/g, 'a').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'lag';

  const oppLabel = (m, nr) => { const n = oppName(m, nr); return '#' + nr + (n ? ' ' + n.split(' ')[0] : ''); };

  // ---------- Data ----------
  async function boot() {

  // En som bare kan se, får laget som er knyttet til dem under «Tilgang»
  function resolveDashCtx() {
    if (!S.ctxLoaded || S.grants == null) return;

  async function logEvent(type, who, code, extra) {
    const m = cur(); if (!m || !S.db) return;
    const set = (m.current && m.current.set) || 1;
    const key = deviceId + '-s' + set;
    const own = (S.logs[key] || []).slice();
    const ev = Object.assign({ t: Date.now(), set, type, p: who, c: code }, extra || {});
    const nm = type === 'opp' || type === 'dir' ? ((oppP(m, who) || {}).name || '') : (((type === 'rec' || type === 'att' || type === 'srv') && player(who)) || {}).name;
    if (nm && !String(nm).startsWith('#')) ev.n = nm;
    own.push(ev);
    S.logs[key] = own;
    render();
    try { await S.db.doc(PFX + 'matches/' + m.id + '/log/' + key).set({ device: deviceId, set, events: own }); }
    catch (e) { S.error = 'Registreringen ble ikke lagret (' + e.code + ').'; render(); }

  }

  async function undo() {
    const m = cur(); if (!m || !S.db) return;
    let bestKey = null, bestT = -1;
    Object.entries(S.logs).forEach(([k, evs]) => { if (k.startsWith(deviceId + '-') && evs.length && evs[evs.length - 1].t > bestT) { bestT = evs[evs.length - 1].t; bestKey = k; } });
    if (!bestKey) return;
    const own = S.logs[bestKey].slice(0, -1);
    S.logs[bestKey] = own; render();
    try { await S.db.doc(PFX + 'matches/' + m.id + '/log/' + bestKey).set({ device: deviceId, set: Number(bestKey.split('-s')[1]), events: own }); }
    catch (e) { S.error = 'Angre ble ikke lagret (' + e.code + ').'; render(); }
  }

  // ---------- Statistikk ----------
  function computeStats(events) {
    const rec = {}, att = {}, srv = {}, opp = {};
    const bump = (o, k) => (o[k] ||= { n: 0, s: 0, c0: 0, c1: 0, c2: 0, B: 0, F: 0, I: 0, E: 0 });
    events.forEach((e) => {
      if (e.type === 'rec') { const r = bump(rec, e.p); r.n++; r['c' + e.c]++; r.s += Number(e.c); }
      if (e.type === 'opp') { const r = bump(opp, e.p); r.n++; r['c' + e.c]++; r.s += Number(e.c); }
      if (e.type === 'att') { const r = bump(att, e.p); r.n++; if (e.c === 'B') r.B++; else r['c' + e.c]++; }
      if (e.type === 'srv') { const r = bump(srv, e.p); r.n++; r[e.c]++; }
    });
    const sum = (o) => Object.values(o).reduce((a, r) => { Object.keys(r).forEach((k) => a[k] = (a[k] || 0) + r[k]); return a; }, { n: 0, s: 0, c0: 0, c1: 0, c2: 0, B: 0, F: 0, I: 0, E: 0 });
    return { rec, att, srv, opp, tRec: sum(rec), tAtt: sum(att), tSrv: sum(srv), tOpp: sum(opp) };
  }

  // ---------- Visninger ----------
  function render() {
    if (S.view === 'live' && !S.offline && cur()) {
      const root = document.getElementById('live-root');
      if (root && root.dataset.sig === liveSig(cur())) { updateLive(); return; }
    }
    const active = document.activeElement;
    const keepId = active && active.id && active.tagName !== 'SELECT' ? active.id : null;
    let selStart = null; try { selStart = active && 'selectionStart' in active ? active.selectionStart : null; } catch (e) {}
    const keepVal = active && active.tagName === 'INPUT' ? active.value : null;
    let html = '';
    if (S.offline) html = offlineView();
    else if (S.dash && S.noAccess) html = noAccessView();
    else if (!S.ready) html = '<div class="panel"><div class="empty">Laster kamper …</div></div>';
    else if (S.view === 'live' && cur()) html = liveView();
    else if (S.view === 'squad' && cur()) html = squadView();
    else if (S.view === 'detail' && cur()) html = detailView();
    else if (S.view === 'sheet' && cur()) html = sheetView();
    else if (S.view === 'season') html = seasonView();
    else if (S.view === 'table') html = tableView();
    else if (S.view === 'access' && S.canAdmin) html = accessView();
    else if (S.view === 'legend') html = legendView();
    else if (S.view === 'watch' && cur()) html = cur().status === 'ferdig' ? detailView() : watchView();
    else html = listView();
    app.innerHTML = '<div id="err">' + errHtml() + '</div>' + html;
    if (S.view === 'live') fillMini();
    dirSync();
    if (S.menuOpen) { const pop = app.querySelector('.menu-pop'); if (pop) { const r = pop.getBoundingClientRect(); if (r.left < 8) { pop.style.right = 'auto'; pop.style.left = '0'; } } }
    if (keepId) { const el = document.getElementById(keepId); if (el) { if (keepVal != null && el.tagName === 'INPUT') el.value = keepVal; el.focus(); try { if (selStart != null && el.setSelectionRange) el.setSelectionRange(selStart, selStart); } catch (e) {} } }
  }

  const legendLink = () => '<button class="textbtn" data-a="legend" style="padding:0;font-size:12px">Hva betyr fargene?</button>';

    let h = '<header class="bar"><button class="link" data-a="back">‹ Tilbake</button><div class="title"><span class="display">Fargeforklaring</span><span class="sub">' + esc(CTX.name) + ' · grenser for ' + g + '</span></div><span class="spacer"></span></header>';
    h += '<section class="panel"><div class="panel-head"><h2>Slik leses søylene</h2></div><div class="status">Alle snitt er på skalaen 0–2, og søylen viser hvor langt opp på skalaen snittet ligger. Fargen viser nivået: grønn er godt, gul er middels og rød er svakt. Grensene er ulike for angrep og mottak, for midtspillere og for kvinner og menn. Laget du står i, bruker grensene for <b>' + g + '</b>.</div>' + table(g) + '</section>';
    h += '<section class="panel"><div class="panel-head"><h2>Hvorfor disse grensene</h2></div><div class="status" style="display:flex;flex-direction:column;gap:8px">'
      + '<span><b>Angrep.</b> Snittet er 1 + (poeng − feil − blokkert) / antall angrep. Det er den vanlige internasjonale angrepseffektiviteten pluss 1, så 1,25 tilsvarer en effektivitet på 0,250. Tommelfingerregler fra USA sier at under 0,100 er svakt, 0,200–0,250 er middels og 0,250–0,300 er godt.</span>'
      + '<span><b>Kvinner og menn.</b> Studier fra europeiske mesterskap og fra amerikansk collegevolleyball viser at menn har omtrent 0,07–0,10 høyere angrepseffektivitet, mest fordi de får flere poeng. Kvinner er litt bedre i mottak, trolig fordi menn server hardere. Derfor er angrepsgrensene lavere og mottaksgrensene litt høyere for kvinner.</span>'
      + '<span><b>Midtspillere.</b> Midtspillere angriper raskere og oftere mot enkeltblokk, og har normalt klart høyere effektivitet enn kant og diagonal. De får derfor en høyere grense. Posisjonen hentes fra troppen.</span>'
      + '<span><b>Mottak.</b> Snittet er 0 for feil, 1 for spillbart og 2 for perfekt, og kan leses som 1 + andel perfekte − andel feil. 1,40 betyr altså 40 prosentpoeng flere perfekte mottak enn feil. Det finnes ingen internasjonal norm for akkurat denne skalaen (vanligst er 0–3), så mottaksgrensene er en faglig vurdering.</span>'
      + '<span><b>Serve.</b> Snittet er 0 for feil, 1 for serve i spill og 2 for ess, altså 1 + (ess − feil) / antall serve. Over 1,00 betyr flere ess enn feil. Grensene er en faglig vurdering, litt lavere for menn fordi hoppserve gir flere feil.</span>'
      + '<span><b>Lav og høy.</b> Spilleren med lavest snitt markeres med oransje «Lav», og den med høyest snitt med grønn «Høy», i mottak, angrep og serve, både i registreringen og i tabellene. Bare spillere med minst 5 mottak eller angrep, eller minst 3 serve, er med (i kampvisningen gjelder litt høyere krav ut fra volumet i kampen). Motstanderens svakeste mottaker markeres med «Server hit».</span>'
      + '<span><b>Motstanderens mottak</b> bruker de samme fargene. Grønt der betyr at motstanderen tar imot godt, altså at vår serve har lite effekt.</span>'
      + '</div></section>';
    h += '<section class="panel"><div class="panel-head"><h2>Grenser for ' + (g === 'menn' ? 'kvinner' : 'menn') + '</h2></div>' + table(g === 'menn' ? 'kvinner' : 'menn') + '<div class="code-legend">Velges automatisk ut fra laget. Nye sesonger og lag får valget «Klasse» når de opprettes.</div></section>';

  // Antall og snitt (0–2) ved siden av navnet: hele kampen
  function fillMini() {
    if (!cur()) return;
    const st = computeStats(allEvents());
    // Svakeste mottaker hos motstanderen (lavest snitt, minst 5 mottak i kampen) markeres også i registreringen
    const weakOpp = (Object.entries(st.opp).filter(([, r]) => r.n >= 5).sort((a, b) => (a[1].s / a[1].n) - (b[1].s / b[1].n) || b[1].n - a[1].n)[0] || [])[0];
    const recAvg = (r) => r.s / r.n, many = (o) => Object.keys(o).length > 1;
    // Lav og høy i registreringen gjelder spillerne som står i listen (på banen / i mottak), ikke de som har gått ut
    const shown = { rec: new Set(), att: new Set(), srv: new Set() };
    app.querySelectorAll('[data-mini]').forEach((el) => { const [t, id] = [el.dataset.mini.slice(0, el.dataset.mini.indexOf('|')), el.dataset.mini.slice(el.dataset.mini.indexOf('|') + 1)]; if (shown[t]) shown[t].add(id); });
    const only = (o, t) => Object.fromEntries(Object.entries(o).filter(([id]) => shown[t].has(id)));
    const ex = { rec: extremes(only(st.rec, 'rec'), recAvg, 5), att: extremes(only(st.att, 'att'), attAvg, 5), srv: extremes(only(st.srv, 'srv'), srvAvg, 3) };
    app.querySelectorAll('[data-mini]').forEach((el) => {
      const i = el.dataset.mini.indexOf('|'); const t = el.dataset.mini.slice(0, i), id = el.dataset.mini.slice(i + 1);
      const r = ({ rec: st.rec, att: st.att, srv: st.srv, opp: st.opp })[t][id];
      let txt = '';
      if (r && r.n) {
        if (t === 'rec' || t === 'opp') txt = r.n + ' · snitt ' + dec(r.s / r.n) + avgBarOnly(r.s / r.n, 'blk');
        else if (t === 'att') txt = r.n + ' · snitt ' + dec(1 + (r.c2 - r.c0 - r.B) / r.n) + avgBarOnly(1 + (r.c2 - r.c0 - r.B) / r.n, 'blk', 'att', posOf(id));
        else txt = esc(r.n + ' · ' + r.E + ' ess ' + r.F + ' feil') + avgBarOnly(srvAvg(r), 'blk', 'srv');
      }
      const weak = t === 'opp' ? id === weakOpp : !!ex[t] && id === ex[t].lo, strong = t !== 'opp' && !!ex[t] && id === ex[t].hi;
      if (weak) txt += '<span class="weak-tag reg">' + (t === 'opp' ? 'Server hit' : 'Lav') + '</span>';

      el.innerHTML = txt;
    });

  // Tabell: CEV-poeng (3–0/3–1 gir 3, 3–2 gir 2, 2–3 gir 1), så seire, poeng, settkvotient og ballkvotient
  function tableMatches() {
    return S.matches.filter((m) => m.stage !== 'sluttspill' && !isSlot(m.home) && !isSlot(m.away) && !isTest(m) && (!m.custom || m.type === 'turnering' || m.type === 'serie'));
  }
  function standings() {
    const T = {}; const row = (t) => (T[t] ||= { team: t, k: 0, v: 0, tap: 0, p: 0, sv: 0, st: 0, bv: 0, bt: 0 });
    tableMatches().forEach((m) => {
      row(m.home); row(m.away);
      if (m.status !== 'ferdig' || !(m.setsHome + m.setsAway)) return;
      const H = row(m.home), A = row(m.away), hs = m.setsHome || 0, as = m.setsAway || 0;
      H.k++; A.k++; H.sv += hs; H.st += as; A.sv += as; A.st += hs;
      (m.setScores || []).forEach(([x, y]) => { H.bv += x; H.bt += y; A.bv += y; A.bt += x; });
      const win = hs > as ? H : A, lose = hs > as ? A : H, close = Math.min(hs, as) === 2;
      win.v++; lose.tap++; win.p += close ? 2 : 3; lose.p += close ? 1 : 0;
    });
    const q = (a, b) => b ? a / b : (a ? Infinity : 0);
    return Object.values(T).sort((a, b) => b.v - a.v || b.p - a.p || q(b.sv, b.st) - q(a.sv, a.st) || q(b.bv, b.bt) - q(a.bv, a.bt) || a.team.localeCompare(b.team, 'nb'));
  }
  function tableView() {
    const st = standings(), q = (a, b) => b ? (Math.round(a / b * 1000) / 1000).toFixed(3).replace('.', ',') : (a ? 'MAX' : '–');
    const all = tableMatches(), done = all.filter((m) => m.status === 'ferdig').length;
    let h = '<header class="bar"><button class="link" data-a="back">‹ Kamper</button><div class="title"><span class="display">Tabell</span><span class="sub">' + esc(CTX.name) + ' · ' + done + ' av ' + all.length + ' kamper spilt</span></div><span class="spacer"></span></header>';
    h += '<section class="panel"><div class="tbl-wrap"><table class="tbl standings"><thead><tr><th>#</th><th class="l-al">Lag</th><th>K</th><th>V</th><th>T</th><th>Poeng</th><th>Sett</th><th class="hide-sm">Settkv.</th><th class="hide-sm">Ballkv.</th></tr></thead><tbody>'
      + st.map((r, i) => '<tr' + (r.team === OUR ? ' class="us"' : '') + '><td>' + (i + 1) + '</td><td class="key l-al">' + teamTag(r.team, 'sm', shortName(r.team)) + '</td><td>' + r.k + '</td><td>' + r.v + '</td><td>' + r.tap + '</td><td class="key">' + r.p + '</td><td>' + r.sv + '–' + r.st + '</td><td class="hide-sm">' + q(r.sv, r.st) + '</td><td class="hide-sm">' + q(r.bv, r.bt) + '</td></tr>').join('')
      + '</tbody></table></div><div class="code-legend">Rangering: seire, poeng (3–0 og 3–1 gir 3 poeng, 3–2 gir 2 og 2–3 gir 1), settkvotient, ballkvotient.</div></section>';
    const po = S.matches.filter((m) => m.stage === 'sluttspill' || isSlot(m.home) || isSlot(m.away));
    if (po.length) h += '<section class="panel"><div class="panel-head"><h2>Sluttspill</h2></div><div class="po">' + po.map((m) => {
      const slot = (t) => { if (!isSlot(t)) return esc(t); const r = st[parseInt(t, 10) - 1]; return esc(t) + (r && r.k ? ' <span class="muted">(nå: ' + esc(shortName(r.team)) + ')</span>' : ''); };
      return '<button class="po-card" data-a="open" data-id="' + esc(m.id) + '"><span class="label">' + esc(m.round || 'Sluttspill') + ' · ' + esc(fmtDate(m.date)) + (m.venue ? ' · ' + esc(m.venue) : '') + '</span><span class="po-teams">' + slot(m.home) + ' – ' + slot(m.away) + '</span><span class="po-res">' + (m.status === 'ferdig' ? (m.setsHome || 0) + '–' + (m.setsAway || 0) + (setList(m) ? ' <small>(' + esc(setList(m)) + ')</small>' : '') : 'Ikke spilt') + '</span></button>';
    }).join('') + '</div></section>';
    const days = {}; all.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '')).forEach((m) => { const d = (m.date || '').slice(0, 10); (days[d] ||= []).push(m); });
    h += '<section class="panel"><div class="panel-head"><h2>Kamper</h2><span class="status">' + (S.dash ? 'Trykk en kamp for å se den' : 'Trykk en kamp for å registrere resultat eller føre statistikk') + '</span></div><div class="rounds">'
      + Object.entries(days).map(([d, list]) => '<section class="round"><h2 class="label">' + esc(fmtDate(d)) + '</h2>' + list.map(matchRow).join('') + '</section>').join('') + '</div></section>';
    return h;
  }

  async function saveOpp(m, players, team) {
    team = team || oppTeam(m); const id = teamSlug(team);
    players = players.slice().sort((a, b) => Number(a.nr) - Number(b.nr));
    S.opps = Object.assign({}, S.opps, { [id]: { name: team, players } }); render();
    if (!S.db) return;
    try { await S.db.doc(PFX + 'opponents/' + id).set({ name: team, players }); }
    catch (e) { S.error = 'Motstanderens spillere ble ikke lagret (' + e.code + ').'; render(); }
  }
  function setOppNumbers(m, list) { list = [...new Set(list.map(String))].sort((a, b) => Number(a) - Number(b)); m.oppNumbers = list; render(); saveMatch(m.id, { oppNumbers: list }); }
  async function deleteMatch(m) {
    if (!S.db || !m) return;
    try {
      const logs = await S.db.collection(PFX + 'matches/' + m.id + '/log').get();
      for (const d of logs.docs) await S.db.doc(PFX + 'matches/' + m.id + '/log/' + d.id).delete();
      await S.db.doc(PFX + 'matches/' + m.id).delete();
      closeSeasonLogs(); openLogs(null); S.view = 'list'; S.matchId = null; render(); toTop();
    } catch (e) { S.error = 'Kampen ble ikke slettet (' + e.code + ').'; render(); }
  }

  // ---------- Kampark (som Excel-arket) ----------
  function sheetView() {
    const m = cur();
    const oppName = m.home === usName(m) ? m.away : m.home;
    const evs = allEvents();
    const maxSet = Math.max(5, ...evs.map((e) => e.set || 1), (m.current && m.current.set) || 1);
    const sets = Array.from({ length: maxSet }, (_, i) => i + 1);
    const d = m.date ? new Date(m.date) : null;
    const dstr = d && !isNaN(d) ? d.getDate() + '/' + (d.getMonth() + 1) + '-' + String(d.getFullYear()).slice(2) : '';
    const res = (m.setsHome || 0) + '–' + (m.setsAway || 0) + (setList(m) ? ' (' + setList(m) + ')' : '');
    const byType = (type) => evs.filter((e) => e.type === type);
    const order = (ids) => { const r = teamRoster(m).map((p) => p.id).filter((id) => ids.includes(id)); ids.forEach((id) => { if (!r.includes(id)) r.push(id); }); return r; };

    const cell = (e) => {
      if (e.type === 'att' && e.c === 'B') return '<b class="red">0</b>';
      if (e.type === 'srv') return e.c === 'E' ? '<b class="ace">E</b>' : e.c === 'F' ? '<b class="red">F</b>' : 'I';
      return esc(e.c);
    };
    const block = (title, type, ids, labelOf, totalsHead, totals) => {
      const list = byType(type);
      let h = '<tr><td class="sk-gap" colspan="' + (sets.length + 4) + '"></td></tr>'
        + '<tr><td class="sk-blank"></td><td class="sk-band" colspan="' + (sets.length + 3) + '">' + title + '</td></tr>'
        + '<tr><td class="sk-blank"></td>' + sets.map((n) => { const sc = scoreStr((m.setScores || [])[n - 1]); return '<td class="sk-sh ' + (n % 2 ? 'g' : 'gr') + '">' + n + '. sett' + (sc ? ' <span class="sk-sc">' + sc + '</span>' : '') + '</td>'; }).join('')
        + totalsHead.map((t) => '<td class="sk-th">' + t + '</td>').join('') + '</tr>';
      if (!ids.length) h += '<tr><td class="sk-name">–</td><td colspan="' + (sets.length + 3) + '" class="sk-empty">Ingen registreringer</td></tr>';
      ids.forEach((id) => {
        const mine = list.filter((e) => String(e.p) === String(id));
        h += '<tr><td class="sk-name">' + esc(labelOf(id)) + '</td>'
          + sets.map((n) => '<td class="sk-c ' + (n % 2 ? 'g' : 'gr') + '">' + mine.filter((e) => e.set === n).map(cell).join(' ') + '</td>').join('')
          + totals(mine).map((v) => '<td class="sk-t num">' + v + '</td>').join('') + '</tr>';
      });
      return h;
    };
    const sumAvg = (mine) => { const n = mine.length, s = mine.reduce((a, e) => a + (e.c === 'B' ? 0 : Number(e.c) || 0), 0); return [n, s, n ? dec(s / n) : '–']; };

    const recIds = order([...new Set(byType('rec').map((e) => e.p).concat(m.receivers || []))]);
    const attIds = order([...new Set(byType('att').map((e) => e.p).concat(m.onCourt || []))]);
    const srvIds = order([...new Set(byType('srv').map((e) => e.p).concat(m.onCourt || []))]);
    const oppIds = [...new Set(byType('opp').map((e) => String(e.p)).concat(m.oppNumbers || []))].sort((a, b) => Number(a) - Number(b));

    let t = '<table class="sk"><tbody>'
      + '<tr><td class="sk-title" colspan="' + (Math.ceil(sets.length / 2) + 1) + '">' + esc(m.home) + ' - ' + esc(m.away) + (dstr ? ' ' + dstr : '') + '</td>'
      + '<td class="sk-legend" colspan="' + (sets.length - Math.ceil(sets.length / 2) + 3) + '">0 Feil (blokkert vises som rød 0)<br>1 Spill videre<br>2 Perfekt / poeng</td></tr>'
      + '<tr><td class="sk-res" colspan="' + (sets.length + 4) + '">Resultat: ' + esc(res) + '</td></tr>'
      + block('Mottak', 'rec', recIds, pname, ['Antall', 'Poeng', 'Snitt'], sumAvg)
      + block('Angrep', 'att', attIds, pname, ['Antall', 'Poeng', 'Snitt'], sumAvg)
      + block('Serve <span class="sk-sub">(F feil · I i spill · E ess)</span>', 'srv', srvIds, pname, ['Antall', 'Ess', 'Feil'], (mine) => [mine.length, mine.filter((e) => e.c === 'E').length, mine.filter((e) => e.c === 'F').length])
      + block(esc(oppName) + ' mottak', 'opp', oppIds, (n) => oppLabel(m, n), ['Antall', 'Poeng', 'Snitt'], sumAvg)
      + '</tbody></table>';

    return '<header class="bar"><button class="link" data-a="to-live">‹ Tilbake til kampen</button><div class="title"><span class="display">Kampark</span><span class="sub">' + esc(m.home) + ' – ' + esc(m.away) + '</span></div><span class="spacer"></span>'

  function loadScript(src) {
    return new Promise((res, rej) => { if (document.querySelector('script[src="' + src + '"]')) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load')); document.head.appendChild(s); });
  }

  async function exportXlsx(m, btn) {
    if (!S.dl) { S.error = 'Nedlasting er ikke tilgjengelig i denne visningen.'; render(); return; }
    const old = btn.textContent; btn.textContent = 'Lager Excel …'; btn.disabled = true;
    try {
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js');
      const oppName = m.home === usName(m) ? m.away : m.home;
      const evs = allEvents();
      const maxSet = Math.max(5, ...evs.map((e) => e.set || 1));
      const sets = Array.from({ length: maxSet }, (_, i) => i + 1);
      const byType = (type) => evs.filter((e) => e.type === type);
      const order = (ids) => { const r = teamRoster(m).map((p) => p.id).filter((id) => ids.includes(id)); ids.forEach((id) => { if (!r.includes(id)) r.push(id); }); return r; };
      const sections = [
        { title: 'Mottak', type: 'rec', ids: order([...new Set(byType('rec').map((e) => e.p).concat(m.receivers || []))]), label: pname, heads: ['Antall', 'Poeng', 'Snitt'], kind: 'num' },
        { title: 'Angrep', type: 'att', ids: order([...new Set(byType('att').map((e) => e.p).concat(m.onCourt || []))]), label: pname, heads: ['Antall', 'Poeng', 'Snitt'], kind: 'num' },
        { title: 'Serve (F feil · I i spill · E ess)', type: 'srv', ids: order([...new Set(byType('srv').map((e) => e.p).concat(m.onCourt || []))]), label: pname, heads: ['Antall', 'Ess', 'Feil'], kind: 'srv' },
        { title: oppName + ' mottak', type: 'opp', ids: [...new Set(byType('opp').map((e) => String(e.p)).concat(m.oppNumbers || []))].sort((a, b) => Number(a) - Number(b)), label: (n) => oppLabel(m, n), heads: ['Antall', 'Poeng', 'Snitt'], kind: 'num' }
      ];
      // Felles kolonnebredde per sett: flest koder én spiller har i det settet, minst 6, pluss to ledige for manuell føring
      const width = {};
      sets.forEach((n) => {
        let mx = 6;
        sections.forEach((sec) => sec.ids.forEach((id) => { const c = byType(sec.type).filter((e) => String(e.p) === String(id) && e.set === n).length; if (c + 2 > mx) mx = c + 2; }));
        width[n] = mx;
      });
      const start = {}; let col = 2;
      sets.forEach((n) => { start[n] = col; col += width[n]; });
      const tCol = col; const lastCol = tCol + 2;

      const wb = new window.ExcelJS.Workbook();
      const ws = wb.addWorksheet('Kampark', { views: [{ state: 'frozen', xSplit: 1 }], pageSetup: { orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0, paperSize: 9 } });
      ws.getColumn(1).width = 14;
      for (let c = 2; c < tCol; c++) ws.getColumn(c).width = 3.3;
      for (let c = tCol; c <= lastCol; c++) ws.getColumn(c).width = 9;
      const fill = (argb) => ({ type: 'pattern', pattern: 'solid', fgColor: { argb } });
      const thin = { style: 'thin', color: { argb: 'FF333333' } };
      const setFill = (n) => fill(n % 2 ? 'FFD9D9D9' : 'FF70AD47');
      const L = (c) => ws.getColumn(c).letter;

      const d = m.date ? new Date(m.date) : null;
      const dstr = d && !isNaN(d) ? ' ' + d.getDate() + '/' + (d.getMonth() + 1) + '-' + String(d.getFullYear()).slice(2) : '';
      const titleEnd = Math.max(2, start[Math.min(3, maxSet)] - 1);
      ws.mergeCells(1, 1, 1, titleEnd);
      const tc = ws.getCell(1, 1); tc.value = m.home + ' - ' + m.away + dstr; tc.font = { bold: true, italic: true, color: { argb: 'FFFFFFFF' }, size: 14 }; tc.fill = fill('FF000000'); tc.alignment = { horizontal: 'center' };
      ['0 Feil (blokkert = rød 0)', '1 Spill videre', '2 Perfekt / poeng'].forEach((t, i) => { const c = ws.getCell(1 + i, titleEnd + 2); c.value = t; c.font = { bold: true, color: { argb: 'FFC00000' } }; });
      ws.getCell(3, 1).value = 'Resultat: ' + (m.setsHome || 0) + '-' + (m.setsAway || 0) + (setList(m) ? ' (' + setList(m).replace(/–/g, '-') + ')' : '');

      let r = 5;
      sections.forEach((sec) => {
        ws.mergeCells(r, 2, r, lastCol);
        const b = ws.getCell(r, 2); b.value = sec.title; b.fill = fill('FF9DC3E6'); b.font = { bold: true, italic: true }; b.alignment = { horizontal: 'center' };
        r++;
        sets.forEach((n) => { ws.mergeCells(r, start[n], r, start[n] + width[n] - 1); const c = ws.getCell(r, start[n]); const scx = scoreStr((m.setScores || [])[n - 1]); c.value = n + '. sett' + (scx ? ' (' + scx.replace('–', '-') + ')' : ''); c.font = { bold: true }; for (let k = 0; k < width[n]; k++) ws.getCell(r, start[n] + k).fill = setFill(n); });
        sec.heads.forEach((h, i) => { const c = ws.getCell(r, tCol + i); c.value = h; c.font = { bold: true }; c.fill = fill('FFFFE699'); c.border = { top: thin, left: thin, bottom: thin, right: thin }; c.alignment = { horizontal: 'center' }; });
        r++;
        const ids = sec.ids.length ? sec.ids : [null];
        ids.forEach((id) => {
          ws.getCell(r, 1).value = id == null ? '' : sec.label(id); ws.getCell(r, 1).alignment = { horizontal: 'right' };
          sets.forEach((n) => {
            for (let k = 0; k < width[n]; k++) ws.getCell(r, start[n] + k).fill = setFill(n);
            if (id == null) return;
            byType(sec.type).filter((e) => String(e.p) === String(id) && e.set === n).forEach((e, k) => {
              const c = ws.getCell(r, start[n] + k);
              if (sec.kind === 'srv') { c.value = e.c; if (e.c === 'F') c.font = { color: { argb: 'FFC00000' }, bold: true }; if (e.c === 'E') c.font = { color: { argb: 'FF1F6B2E' }, bold: true }; }
              else if (e.c === 'B') { c.value = 0; c.font = { color: { argb: 'FFC00000' } }; }
              else c.value = Number(e.c);
              c.alignment = { horizontal: 'center' };
            });
          });
          const rng = L(2) + r + ':' + L(tCol - 1) + r;
          const f = sec.kind === 'srv'
            ? ['COUNTA(' + rng + ')', 'COUNTIF(' + rng + ',"E")', 'COUNTIF(' + rng + ',"F")']
            : ['COUNT(' + rng + ')', 'SUM(' + rng + ')', 'IF(' + L(tCol) + r + '=0,"",' + L(tCol + 1) + r + '/' + L(tCol) + r + ')'];
          f.forEach((fx, i) => { const c = ws.getCell(r, tCol + i); c.value = { formula: fx }; c.fill = fill('FFFFE699'); c.border = { top: thin, left: thin, bottom: thin, right: thin }; if (i === 2 && sec.kind !== 'srv') c.numFmt = '0.00'; });
          r++;
        });
        r++;
      });
      const note = ws.getCell(r, 1); note.value = 'Røde 0 i angrep = blokkert. Formlene i de gule kolonnene teller med koder du legger til eller endrer manuelt.'; note.font = { italic: true, color: { argb: 'FF555555' } };

      const buf = await wb.xlsx.writeBuffer();
      const name = ('kampark-' + m.home + '-' + m.away).replace(/[^\wæøåÆØÅ-]+/g, '-') + '.xlsx';
      await S.dl.save({ filename: name, data: new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }) });
    } catch (e) {
      if (!e || e.code !== 'declined') { S.error = 'Excel-filen kunne ikke lages' + (e && e.code ? ' (' + e.code + ')' : '') + '. Prøv igjen.'; }
    }
    btn.textContent = old; btn.disabled = false; if (S.error) render();
  }

  async function exportPdf(m, btn) {
    if (!S.dl) { S.error = 'Nedlasting er ikke tilgjengelig i denne visningen.'; render(); return; }
    const old = btn.textContent; btn.textContent = 'Lager PDF …'; btn.disabled = true;
    try {
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
      const el = document.getElementById('sk-sheet');
      const canvas = await window.html2canvas(el, { scale: 2, backgroundColor: '#FFFFFF', windowWidth: el.scrollWidth });
      const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
      const W = 297 - 16, H = 210 - 16;
      const ratio = Math.min(W / canvas.width, H / canvas.height);
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', 8, 8, canvas.width * ratio, canvas.height * ratio);
      const name = ('kampark-' + m.home + '-' + m.away).replace(/[^\wæøåÆØÅ-]+/g, '-') + '.pdf';
      await S.dl.save({ filename: name, data: pdf.output('blob') });
    } catch (e) {
      if (!e || e.code !== 'declined') { S.error = 'PDF-en kunne ikke lages' + (e && e.code ? ' (' + e.code + ')' : '') + '. Prøv igjen, eller bruk CSV.'; }
    }
    btn.textContent = old; btn.disabled = false; if (S.error) render();
  }

  // Mottakssnitt (0–2) for NVBF-kamper, regnet fra antall, feil og perfekt %: perfekt = 2, feil = 0, resten = 1
  function addRecAvg(n) {
    if (!n || !n.teams) return;
    const num = (v) => { const x = parseFloat(String(v ?? '').replace('%', '').replace(',', '.').replace('−', '-')); return isNaN(x) ? null : x; };
    n.teams.forEach((t) => {
      let N = 0, Pf = 0, F = 0;
      (t.players || []).forEach((p) => {
        const perf = num(p.recPerf);
        if (!p.rec || perf == null) return;
        const pn = Math.round(p.rec * perf / 100), f = p.recErr || 0;
        if (p.recAvg == null) p.recAvg = dec((2 * pn + (p.rec - pn - f)) / p.rec);
        N += p.rec; Pf += pn; F += f;
      });
      if (N) { t.totals = t.totals || {}; if (t.totals.recAvg == null) t.totals.recAvg = dec((2 * Pf + (N - Pf - F)) / N); }
    });
  }

  // Egen føring samlet i samme form som NVBF-statistikken, til visningsmodus for avsluttede kamper
  function ownStats(m, evs) {
    const E = evs.filter((e) => e.type === 'rec' || e.type === 'att' || e.type === 'srv' || e.type === 'opp');
    if (!E.length) return null;
    const cnt = (a, v) => a.filter((x) => x === v).length;
    const avg = (a) => a.length ? dec(a.reduce((s, x) => s + (Number(x) || 0), 0) / a.length) : undefined;
    const sp = {}; const get = (id) => (sp[id] ||= { id, rec: [], att: [], srv: [] });
    E.forEach((e) => { if (e.type !== 'opp') get(e.p)[e.type].push(String(e.c)); });
    const inServe = E.some((e) => e.type === 'srv' && String(e.c) === 'I');
    const ord = teamRoster(m).map((p) => p.id); const ix = (id) => { const i = ord.indexOf(id); return i < 0 ? 999 : i; };
    const T = { rec: [], att: [], srv: [] };
    const players = Object.values(sp).sort((a, b) => ix(a.id) - ix(b.id)).map((p) => {
      const pl = player(p.id) || {}; const o = { nr: pl.nr || '', name: pl.name || pname(p.id) };
      if (p.rec.length) Object.assign(o, { rec: p.rec.length, recErr: cnt(p.rec, '0'), recAvg: avg(p.rec), recPlay: pct(cnt(p.rec, '1'), p.rec.length), recPerf: pct(cnt(p.rec, '2'), p.rec.length) });
      if (p.att.length) { const k = cnt(p.att, '2'); Object.assign(o, { att: p.att.length, kills: k, attErr: cnt(p.att, '0'), blocked: cnt(p.att, 'B'), kp: pct(k, p.att.length) }); }
      if (p.srv.length || p.att.length) { Object.assign(o, { aces: cnt(p.srv, 'E'), srvErr: cnt(p.srv, 'F'), pts: cnt(p.att, '2') + cnt(p.srv, 'E') }); if (inServe) o.srv = p.srv.length; }
      T.rec.push(...p.rec); T.att.push(...p.att); T.srv.push(...p.srv);
      return o;
    });
    const k = cnt(T.att, '2'), f = cnt(T.att, '0'), b = cnt(T.att, 'B');
    const totals = { recAvg: avg(T.rec), recPerf: T.rec.length ? pct(cnt(T.rec, '2'), T.rec.length) : undefined, aces: cnt(T.srv, 'E'), srvErr: cnt(T.srv, 'F'), pts: k + cnt(T.srv, 'E') };
    if (T.att.length) Object.assign(totals, { kp: pct(k, T.att.length), eff: pct1(k - f - b, T.att.length) });
    if (inServe) totals.srv = T.srv.length;
    const oppTeamName = m.home === usName(m) ? m.away : m.home;
    const oppr = {};
    E.forEach((e) => { if (e.type === 'opp') (oppr[String(e.p)] ||= []).push(String(e.c)); });
    const opp = { name: oppTeamName, players: [], totals: {} };
    const nums = Object.keys(oppr).sort((a, b) => Number(a) - Number(b));
    if (nums.length) {
      const all = nums.flatMap((n) => oppr[n]);
      opp.players = nums.map((n) => ({ nr: n, name: oppName(m, n), rec: oppr[n].length, recErr: cnt(oppr[n], '0'), recAvg: avg(oppr[n]), recPlay: pct(cnt(oppr[n], '1'), oppr[n].length), recPerf: pct(cnt(oppr[n], '2'), oppr[n].length) }));
      opp.totals = { recAvg: avg(all), recPerf: pct(cnt(all, '2'), all.length) };
    } else opp.missing = 'Motstanderens mottak ble ikke ført i denne kampen.';
    return { source: 'egen', teams: [{ name: usName(m), players, totals }, opp] };
  }

  function detailView() {
    const m = cur(); const ours = canLive(m);
    const own = ours ? ownStats(m, allEvents()) : null; const hasNvbf = !!(m.nvbf && m.nvbf.teams && m.nvbf.teams.length);
    const egen = !!own && !(S.detailSrc === 'nvbf' && hasNvbf); const n = egen ? own : m.nvbf;
    addRecAvg(n);
    const oc = outcome(m);
    let h = '<header class="bar det-bar"><button class="link" data-a="back">‹ Kamper</button><div class="title"><span class="display tm" style="flex-wrap:wrap">' + crest(m.home, 'sm') + esc(shortName(m.home)) + ' – ' + esc(shortName(m.away)) + crest(m.away, 'sm') + ' ' + (m.setsHome != null ? m.setsHome + '–' + m.setsAway : '') + (oc ? ' <span class="badge ' + (oc === 'win' ? 'b-win">Seier' : 'b-loss" style="color:#F0A774;box-shadow:inset 0 0 0 1.5px #F0A774">Tap') + '</span>' : '') + '</span><span class="sub">' + esc(fmtDate(m.date)) + ((m.setScores || []).length ? ' · ' + m.setScores.map((s) => s[0] + '–' + s[1]).join(' · ') : '') + '</span></div><span class="spacer"></span>'

    if (!ours && !S.dash) h += othersPanel(m);

    if (!n || !n.teams || !n.teams.length) return h + '<div class="panel"><div class="empty">' + (ours ? (S.dash && !window.PUBLIC ? 'Det er ikke ført statistikk i denne kampen ennå.' : 'Statistikken fra denne kampen er ikke lagt ut ennå.') : CTX.id !== 'main' ? (m.status === 'ferdig' ? 'Resultatet er registrert. Det er ikke ført statistikk i denne kampen.' : 'Kampen er ikke spilt ennå.') : m.status === 'ferdig' ? 'Kampstatistikken fra NVBF er ikke hentet inn ennå. Be Claude hente den, så dukker den opp her.' : 'Kampen er ikke spilt ennå. Statistikken kan hentes fra NVBF når den er publisert.') + '</div></div>';
    h += '<div class="status">' + (egen ? 'Egen føring fra benken. Mottak og angrep på skala 0–2.' : 'Offisiell NVBF-statistikk · kontrollert ' + esc(n.checked || 'ukjent tid')) + ' ' + legendLink() + '</div>';
    h += '<div class="rounds">' + n.teams.map((t) => {
      const T = t.totals || {};
      let s = '<section class="panel"><div class="panel-head"><h2>' + esc(t.name) + '</h2></div>';
      if (t.missing) s += '<div class="empty">' + esc(t.missing) + '</div>';
      const k = [['Angrep uttelling', T.kp], ['Angrep snitt (0–2)', T.eff != null ? dec(1 + parseFloat(String(T.eff).replace('−', '-').replace(',', '.')) / 100) : null], ['Mottak snitt (0–2)', T.recAvg], ['Positivt mottak', egen ? null : T.recPos], ['Perfekt mottak', T.recPerf], ['Ess / servefeil', T.aces != null ? T.aces + ' / ' + T.srvErr : null], ['Blokkpoeng', T.blocks]].filter((x) => x[1] != null);
      if (k.length) s += '<div class="kpis">' + k.map((x) => '<div class="kpi"><div class="display num">' + esc(x[1]) + '</div>' + (/snitt/.test(x[0]) ? avgBarOnly(x[1], 'wide', /Angrep/.test(x[0]) ? 'att' : 'rec') : '') + '<div class="k">' + esc(x[0]) + '</div></div>').join('') + '</div>';
      const pr = (t.players || []).filter((p) => p.rec != null).sort((a, b) => b.rec - a.rec);

      const pnum = (v) => v == null ? 0 : parseFloat(String(v).replace(',', '.')) || 0;
      const pick = (arr, cnt, f, minN) => { const el = arr.filter((p) => cnt(p) >= minN).sort((a, b) => f(a) - f(b) || cnt(b) - cnt(a)); return el.length > 1 && f(el[0]) !== f(el[el.length - 1]) ? { lo: el[0], hi: el[el.length - 1] } : {}; };
      const exR = pick(pr, (p) => p.rec, (p) => pnum(p.recAvg), minRec);
      if (pr.length) s += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Mottak</th><th>Ant.</th><th>Snitt</th><th>Feil</th>' + (egen ? '<th>Spillb.</th>' : '<th>Pos.</th>') + '<th>Perf.</th></tr></thead><tbody>' + pr.map((p) => '<tr' + loHi(p, exR)[0] + '><td class="key">' + esc(p.nr ? '#' + p.nr + ' ' : '') + esc(p.name) + loHi(p, exR)[1] + '</td><td>' + p.rec + '</td><td class="key">' + avgBar(p.recAvg, esc(p.recAvg ?? '–')) + '</td><td>' + (p.recErr ?? '–') + '</td>' + (egen ? '<td>' + esc(p.recPlay ?? '–') + '</td>' : '<td>' + esc(p.recPos ?? '–') + '</td>') + '<td>' + esc(p.recPerf ?? '–') + '</td></tr>').join('') + '</tbody></table></div>';

      if (exR.lo || exA.lo) s += '<div class="code-legend"><span class="weak-tag">Lav</span> <span class="weak-tag strong">Høy</span> lavest og høyest snitt blant spillere med minst ' + minRec + ' mottak eller ' + minAtt + ' angrep.</div>';
