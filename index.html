      if (ps.length) s += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Poeng og serve</th><th>Poeng</th><th>Serve</th><th>Ess</th><th>Feil</th><th>Blokk</th></tr></thead><tbody>' + ps.slice().sort((a, b) => (b.pts || 0) - (a.pts || 0) || (b.srv || 0) - (a.srv || 0)).map((p) => '<tr><td class="key">' + esc(p.nr ? '#' + p.nr + ' ' : '') + esc(p.name) + '</td><td class="key">' + (p.pts ?? '–') + '</td><td>' + (p.srv ?? '–') + '</td><td>' + (p.aces ?? '–') + '</td><td>' + (p.srvErr ?? '–') + '</td><td>' + (p.blocks ?? '–') + '</td></tr>').join('') + (T.pts != null ? '<tr class="total"><td>Lag</td><td>' + T.pts + '</td><td>' + (T.srv ?? '–') + '</td><td>' + (T.aces ?? '–') + '</td><td>' + (T.srvErr ?? '–') + '</td><td>' + (T.blocks ?? '–') + '</td></tr>' : '') + '</tbody></table></div>';
      return s + '</section>';
    }).join('') + '</div>';
    return h;
  }

  // ---------- Sesong: kamp for kamp etter terminplanen ----------
  const SEASON = { logs: {}, unsubs: {}, inclTest: false, metric: 'recAvg', sortK: 'recN', sortDir: -1, player: 'team' };
  try { SEASON.inclTest = localStorage.getItem('rv-incltest') === '1'; } catch (e) {}
  const isTest = (m) => String(m.round || '').toLowerCase() === 'test';
  const p0 = (v) => v == null ? '–' : Math.round(v * 100) + ' %';
  const d2 = (v) => v == null ? '–' : dec(v);
  const d1 = (v) => v == null ? '–' : (Math.round(v * 10) / 10).toFixed(1).replace('.', ',');

  function openSeasonLogs() {
    if (!S.db) return;
    S.matches.filter(isOurs).forEach((m) => {
      if (SEASON.unsubs[m.id] || m.status === 'kommende') return;
      SEASON.unsubs[m.id] = S.db.collection(PFX + 'matches/' + m.id + '/log').onSnapshot((snap) => {
        const evs = [];
        snap.docs.forEach((d) => evs.push(...(d.data().events || []))); learnNames(evs, null);
        evs.sort((a, b) => a.t - b.t);
        SEASON.logs[m.id] = evs;
        if (S.view === 'season') render();
      }, (e) => { S.error = 'Registreringene kunne ikke lastes (' + e.code + ').'; render(); });
    });
  }
  function closeSeasonLogs() { Object.values(SEASON.unsubs).forEach((u) => { try { u(); } catch (e) {} }); SEASON.unsubs = {}; }

  const METRICS = [
    { k: 'recAvg', l: 'Mottak snitt', note: '0–2-skala, høyere er bedre', f: (st) => st.tRec.n ? st.tRec.s / st.tRec.n : null, fmt: d2, fixed: [0, 2], kind: 'rec' },
    { k: 'recPerf', l: 'Perfekt mottak', note: 'andel mottak kodet 2', f: (st) => st.tRec.n ? st.tRec.c2 / st.tRec.n : null, fmt: p0, fixed: [0, 1] },
    { k: 'attEff', l: 'Angrepssnitt', note: '0–2-skala, feil og blokkert teller 0', f: (st) => st.tAtt.n ? 1 + (st.tAtt.c2 - st.tAtt.c0 - st.tAtt.B) / st.tAtt.n : null, fmt: d2, fixed: [0, 2], kind: 'att' },
    { k: 'attKill', l: 'Angrep uttelling', note: 'poeng / angrep', f: (st) => st.tAtt.n ? st.tAtt.c2 / st.tAtt.n : null, fmt: p0, fixed: [0, 1] },
    { k: 'oppAvg', l: 'Motstanders mottak', note: 'snitt 0–2 på vår serve, lavere er bedre', f: (st) => st.tOpp.n ? st.tOpp.s / st.tOpp.n : null, fmt: d2, fixed: [0, 2], kind: 'rec' }
  ];

  function summarize(m) {
    const evs = SEASON.logs[m.id] || [];
    const home = m.home === usName(m);
    const us = home ? (m.setsHome || 0) : (m.setsAway || 0);
    const them = home ? (m.setsAway || 0) : (m.setsHome || 0);
    return { m, evs, home, opp: home ? m.away : m.home, us, them, sets: us + them, done: m.status === 'ferdig', live: m.status === 'pågår', st: computeStats(evs) };
  }

  function lineChart(rows, metric) {
    const W = Math.max(300, Math.min(1360, (app.clientWidth || 700) - 28)), H = 230;
    const ml = 44, mr = 14, mt = 24, mb = W < 520 ? 30 : 44;
    const vals = rows.map((r) => r.evs.length ? metric.f(r.st) : null);
    const have = vals.filter((v) => v != null);
    let lo = metric.fixed ? metric.fixed[0] : Math.min(0, ...have, -0.1), hi = metric.fixed ? metric.fixed[1] : Math.max(0.3, ...have);
    if (!metric.fixed) { lo = Math.floor(lo * 10) / 10; hi = Math.ceil(hi * 10) / 10; }
    const y = (v) => mt + (H - mt - mb) * (1 - (v - lo) / (hi - lo || 1));
    const step = (W - ml - mr) / Math.max(1, rows.length);
    const x = (i) => ml + step * (i + 0.5);
    const ticks = [0, 1, 2, 3, 4].map((i) => lo + (hi - lo) * i / 4);
    let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(metric.l) + ' kamp for kamp">';
    // Fargesoner for snitt: rød, gul og grønn bak kurven, med samme grenser som søylene
    const pos = metric.kind === 'att' && SEASON.player !== 'team' ? posOf(SEASON.player) : '';
    const LV = { lo: 'var(--bad)', mid: '#D9A21B', hi: 'var(--good)' };
    if (metric.kind) {
      const [t0, t1] = thr(metric.kind, pos), cl = (v) => Math.max(lo, Math.min(hi, v));
      [[lo, t0, 'lo'], [t0, t1, 'mid'], [t1, hi, 'hi']].forEach(([a, b, k]) => { if (cl(b) > cl(a)) s += '<rect x="' + ml + '" width="' + (W - ml - mr) + '" y="' + y(cl(b)) + '" height="' + (y(cl(a)) - y(cl(b))) + '" fill="' + LV[k] + '" opacity=".09"></rect>'; });
      [[t0, 11], [t1, -3]].forEach(([t, dy]) => { s += '<text x="' + (ml + 4) + '" y="' + (y(t) + dy) + '" font-size="10" fill="var(--muted)">' + esc(metric.fmt(t)) + '</text>'; });
    }
    ticks.forEach((t) => { s += '<line x1="' + ml + '" x2="' + (W - mr) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="var(--line)" stroke-width="1"></line><text x="' + (ml - 8) + '" y="' + (y(t) + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + esc(metric.fmt(t)) + '</text>'; });
    if (lo < 0 && hi > 0) s += '<line x1="' + ml + '" x2="' + (W - mr) + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="var(--faint)" stroke-width="1"></line>';
    const pooled = metric.f(computeStats(rows.flatMap((r) => r.evs)));
    if (pooled != null) s += '<line x1="' + ml + '" x2="' + (W - mr) + '" y1="' + y(pooled) + '" y2="' + y(pooled) + '" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4 4" opacity=".7"></line><text x="' + (W - mr) + '" y="' + (y(pooled) - 5) + '" text-anchor="end" font-size="11" fill="var(--accent)">Sesong ' + esc(metric.fmt(pooled)) + '</text>';
    const pts = vals.map((v, i) => v == null ? null : [x(i), y(v), v]).filter(Boolean);
    if (pts.length > 1) s += '<path d="' + pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ') + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></path>';
    rows.forEach((r, i) => {
      const v = vals[i], future = !r.done && !r.live;
      if (v != null) s += '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="' + (metric.kind ? 6 : 4.5) + '" fill="' + (metric.kind ? LV[avgLvl(v, metric.kind, pos)] : 'var(--accent)') + '" stroke="var(--surface)" stroke-width="2"></circle><text x="' + x(i) + '" y="' + (y(v) - 10) + '" text-anchor="middle" font-size="11" font-weight="600" fill="var(--fg)">' + esc(metric.fmt(v)) + '</text>';
      else if (!future) s += '<text x="' + x(i) + '" y="' + (H - mb - 6) + '" text-anchor="middle" font-size="10" fill="var(--faint)">' + (SEASON.player === 'team' ? 'ikke ført' : 'ingen reg.') + '</text>';
      const lab = roundShort(r.m);
      s += '<text x="' + x(i) + '" y="' + (H - mb + 16) + '" text-anchor="middle" font-size="11" font-weight="' + (future ? 400 : 600) + '" fill="' + (future ? 'var(--faint)' : 'var(--fg)') + '">' + esc(lab) + '</text>';
      if (W >= 520) s += '<text x="' + x(i) + '" y="' + (H - mb + 31) + '" text-anchor="middle" font-size="10" fill="var(--muted)">' + esc(shortName(r.opp).slice(0, 8)) + '</text>';
    });
    return s + '</svg>';
  }

  function seasonView() {
    const all = S.matches.filter(isOurs).filter((m) => (SEASON.inclTest || !isTest(m)) && m.inSeason !== false).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    const rows = all.map(summarize);
    const played = rows.filter((r) => r.done || r.live);
    const reg = played.filter((r) => r.evs.length);
    const done = rows.filter((r) => r.done);
    const wins = done.filter((r) => r.us > r.them).length, losses = done.length - wins;
    const setsW = done.reduce((a, r) => a + r.us, 0), setsL = done.reduce((a, r) => a + r.them, 0);
    const pool = computeStats(reg.flatMap((r) => r.evs));
    const regSets = reg.reduce((a, r) => a + Math.max(1, r.sets || (r.m.setScores || []).length || 1), 0);
    const last = reg[reg.length - 1];
    const next = rows.find((r) => !r.done && !isTest(r.m));
    const hasTest = S.matches.some((m) => isOurs(m) && isTest(m));
    const solo = SEASON.player !== 'team';
    if (solo && SEASON.metric === 'oppAvg') SEASON.metric = 'recAvg';
    const M = METRICS.find((x) => x.k === SEASON.metric) || METRICS[0];
    const metricsShown = solo ? METRICS.filter((x) => x.k !== 'oppAvg') : METRICS;
    const chartRows = solo ? rows.map((r) => { const evs = r.evs.filter((e) => e.type !== 'opp' && e.type !== 'dir' && String(e.p) === String(SEASON.player)); return { ...r, evs, st: computeStats(evs) }; }) : rows;
    const withRegs = new Set(rows.flatMap((r) => r.evs.filter((e) => e.type !== 'opp' && e.type !== 'dir').map((e) => String(e.p))));
    const pickIds = S.roster.filter((p) => !p.archived || withRegs.has(String(p.id))).map((p) => p.id).concat([...withRegs].filter((id) => !player(id)));
    const pickLabel = (id) => { const p = player(id); return (p && p.nr ? '#' + p.nr + ' ' : '') + (p ? p.name : pname(id)); };
    let soloLine = '';
    if (solo) {
      const ps = computeStats(chartRows.flatMap((r) => r.evs));
      const games = chartRows.filter((r) => r.evs.length).length;
      const r1 = ps.rec[SEASON.player], a1 = ps.att[SEASON.player], s1 = ps.srv[SEASON.player];
      soloLine = '<div class="status"><b>' + esc(pickLabel(SEASON.player)) + '</b> · ' + games + ' kamp' + (games === 1 ? '' : 'er') + ' med registreringer'
        + (r1 ? ' · mottak ' + r1.n + ' (snitt ' + dec(r1.s / r1.n) + ', perfekt ' + pct(r1.c2, r1.n) + ')' : '')
        + (a1 ? ' · angrep ' + a1.n + ' (' + a1.c2 + ' poeng, snitt ' + dec(1 + (a1.c2 - a1.c0 - a1.B) / a1.n) + ')' : '')
        + (s1 ? ' · serve ' + s1.n + ' (' + s1.E + ' ess, ' + s1.F + ' feil)' : '') + '</div>';
    }

    let h = '<div class="season"><header class="bar"><button class="link" data-a="back">‹ Kamper</button>'
      + '<div class="title"><span class="display">Dashboard</span><span class="sub">' + esc(CTX.name) + ' · ' + done.length + ' av ' + rows.length + ' kamper spilt</span></div><span class="spacer"></span>'
      + '<div class="bar-actions">' + (hasTest ? '<button class="barbtn' + (SEASON.inclTest ? ' primary-bar' : '') + '" data-a="incltest" aria-pressed="' + SEASON.inclTest + '">' + (SEASON.inclTest ? 'Testkampen er med' : 'Vis testkampen') + '</button>' : '') + '</div></header>';

    if (next) h += nextHero(next.m, next.live);

    if (!reg.length) h += '<div class="notice">Ingen kamper er ført i appen ennå. Tallene fylles inn automatisk fra første kamp dere fører fra benken.' + (hasTest && !SEASON.inclTest ? ' Trykk «Vis testkampen» for å se hvordan det ser ut.' : '') + '</div>';

    const tile = (lbl, big, sub, v, kind) => '<div class="tile"><span class="label">' + lbl + '</span><span class="big">' + big + '</span>' + (v != null ? avgBarOnly(v, 'wide', kind) : '') + '<span class="sub">' + sub + '</span></div>';
    const recAvg = METRICS[0].f(pool), attEff = METRICS[2].f(pool), oppAvg = METRICS[4].f(pool);
    h += '<section class="tiles" aria-label="Nøkkeltall">'
      + tile('Seire–tap', wins + '–' + losses, 'Sett ' + setsW + '–' + setsL)
      + tile('Mottak snitt', d2(recAvg), 'Perfekt ' + p0(METRICS[1].f(pool)) + (last ? ' · siste ' + d2(METRICS[0].f(last.st)) : ''), recAvg)
      + tile('Angrepssnitt', d2(attEff), 'Uttelling ' + p0(METRICS[3].f(pool)) + (last ? ' · siste ' + d2(METRICS[2].f(last.st)) : ''), attEff, 'att')
      + tile('Ess per sett', pool.tSrv.n ? d1(pool.tSrv.E / regSets) : '–', 'Servefeil per sett ' + (pool.tSrv.n ? d1(pool.tSrv.F / regSets) : '–'))
      + tile('Motstanders mottak', d2(oppAvg), 'Lavere er bedre for vår serve', oppAvg)
      + '</section>';

    h += '<section class="panel" aria-labelledby="h-kurve"><div class="panel-head"><h2 id="h-kurve">Kamp for kamp</h2><span class="status">' + esc(M.note) + '</span></div>'
      + '<div class="kk-controls"><div class="field kk-pick"><label for="kk-player">Spiller</label><select id="kk-player" data-a="kkplayer"><option value="team"' + (solo ? '' : ' selected') + '>Hele laget</option>'
      + pickIds.map((id) => '<option value="' + esc(id) + '"' + (String(SEASON.player) === String(id) ? ' selected' : '') + '>' + esc(pickLabel(id)) + (withRegs.has(String(id)) ? '' : ' (ingen reg.)') + '</option>').join('') + '</select></div>'
      + '<div class="seg" role="group" aria-label="Velg nøkkeltall">' + metricsShown.map((x) => '<button data-a="metric" data-v="' + x.k + '" aria-pressed="' + (x.k === M.k) + '">' + x.l + '</button>').join('') + '</div></div>'
      + soloLine
      + '<div class="chart-box" id="kk-chart">' + lineChart(chartRows, M) + '</div><div class="code-legend">Hele terminplanen langs aksen. Stiplet linje er ' + (solo ? 'spillerens snitt' : 'lagets snitt') + ' for alle førte kamper.' + (solo ? ' Motstanders mottak gjelder bare laget.' : '') + (M.kind ? ' Fargesonene og prikkene viser nivået: grønn, gul og rød etter samme grenser som søylene. ' + legendLink() : '') + '</div></section>';

    h += '<section class="panel" aria-labelledby="h-termin"><div class="panel-head"><h2 id="h-termin">Terminplan</h2><span class="status">' + (window.PUBLIC ? 'Trykk en kamp for å se statistikken' : 'Trykk en kamp for å føre eller se den') + '</span></div><div class="fixtures">'
      + rows.map((r) => {
        const isNext = next && r.m.id === next.m.id;
        const future = !r.done && !r.live;
        const d = r.m.date ? new Date(r.m.date) : null;
        const ds = d && !isNaN(d) ? d.toLocaleDateString('nb-NO', { weekday: 'short', day: 'numeric', month: 'short' }) : '';
        const pill = r.done ? '<span class="res-pill ' + (r.us > r.them ? 'w' : 'l') + '">' + (r.us > r.them ? 'V ' : 'T ') + r.us + '–' + r.them + '</span>' : r.live ? '<span class="res-pill live">Live ' + r.us + '–' + r.them + '</span>' : isNext ? '<span class="badge b-next">Neste</span>' : '';
        const regB = r.evs.length ? '<span class="badge b-own">' + r.evs.length + ' reg.</span>' : (!future ? '<span class="badge b-none">Ikke ført</span>' : '');
        return '<button class="fx' + (isNext ? ' next-fx' : '') + (future && !isNext ? ' future' : '') + '" data-a="open" data-id="' + esc(r.m.id) + '"><span class="fx-top"><span>' + esc(r.m.custom ? (TYPES[r.m.type] || 'Egen kamp') : 'Runde ' + (r.m.round || '–')) + '</span><span>' + esc(ds) + '</span></span>'
          + '<span class="fx-opp">' + (r.home ? 'mot ' : '@ ') + esc(shortName(r.opp)) + '</span><span class="fx-meta">' + (r.home ? 'Hjemme' : 'Borte') + (r.m.venue ? ' · ' + esc(r.m.venue) : '') + '</span>'
          + '<span class="fx-foot">' + pill + regB + '</span></button>';
      }).join('') + '</div></section>';

    h += '<section class="panel" aria-labelledby="h-kamper"><div class="panel-head"><h2 id="h-kamper">Spilte kamper</h2><span class="status">Egenført statistikk per kamp</span></div>';
    if (!played.length) h += '<div class="empty">Ingen kamper spilt ennå.</div>';
    else h += '<div class="tbl-wrap"><table class="tbl t-games"><thead><tr><th>Runde</th><th class="l-al">Motstander</th><th>Res.</th><th>Mottak</th><th>Perf.</th><th>Ang. snitt</th><th>Utt.</th><th>Ess</th><th>Servefeil</th><th>Mot. mottak</th></tr></thead><tbody>'
      + played.map((r) => {
        const st = r.st, has = r.evs.length > 0;
        const cells = has ? ['<td>' + avgBar(METRICS[0].f(st), d2(METRICS[0].f(st))) + '</td>', '<td>' + p0(METRICS[1].f(st)) + '</td>', '<td>' + avgBar(METRICS[2].f(st), d2(METRICS[2].f(st)), 'att', SEASON.player !== 'team' ? posOf(SEASON.player) : '') + '</td>', '<td>' + p0(METRICS[3].f(st)) + '</td>', '<td>' + st.tSrv.E + '</td>', '<td>' + st.tSrv.F + '</td>', '<td>' + avgBar(METRICS[4].f(st), d2(METRICS[4].f(st))) + '</td>'].join('') : '<td colspan="7" class="muted">Ikke ført i appen</td>';
        return '<tr class="clickrow" data-a="open" data-id="' + esc(r.m.id) + '"><td>' + esc(roundShort(r.m)) + '</td><td class="key l-al">' + (r.home ? '' : '@ ') + esc(shortName(r.opp)) + '</td><td class="' + (r.done ? (r.us > r.them ? 'w' : 'l') : '') + '">' + r.us + '–' + r.them + '</td>' + cells + '</tr>';
      }).join('') + '</tbody></table></div>';
    h += '</section>';

    const P = {};
    reg.forEach((r) => r.evs.forEach((e) => {
      if (e.type === 'opp' || e.type === 'dir') return;
      const p = (P[e.p] ||= { id: e.p, games: new Set(), recN: 0, recS: 0, recP: 0, attN: 0, attK: 0, attE: 0, attB: 0, srvN: 0, srvE: 0, srvF: 0 });
      p.games.add(r.m.id);
      if (e.type === 'rec') { p.recN++; p.recS += Number(e.c); if (e.c === '2') p.recP++; }
      if (e.type === 'att') { p.attN++; if (e.c === '2') p.attK++; else if (e.c === '0') p.attE++; else if (e.c === 'B') p.attB++; }
      if (e.type === 'srv') { p.srvN++; if (e.c === 'E') p.srvE++; if (e.c === 'F') p.srvF++; }
    }));
    const prow = Object.values(P).map((p) => ({ ...p, name: pname(p.id), nr: (player(p.id) || {}).nr || '', games: p.games.size, recAvg: p.recN ? p.recS / p.recN : null, recPerf: p.recN ? p.recP / p.recN : null, attEff: p.attN ? 1 + (p.attK - p.attE - p.attB) / p.attN : null }));
    const k = SEASON.sortK, dir = SEASON.sortDir;
    prow.sort((a, b) => k === 'name' ? dir * a.name.localeCompare(b.name, 'nb') : (a[k] == null ? 1 : b[k] == null ? -1 : dir * (a[k] - b[k])));
    const cols = [['name', 'Spiller'], ['games', 'Kamper'], ['recN', 'Mottak'], ['recAvg', 'Snitt'], ['recPerf', 'Perf.'], ['attN', 'Angrep'], ['attEff', 'Snitt'], ['attK', 'Poeng'], ['srvN', 'Serve'], ['srvE', 'Ess'], ['srvF', 'Feil']];
    h += '<section class="panel" aria-labelledby="h-spillere"><div class="panel-head"><h2 id="h-spillere">Spillere hittil</h2><span class="status">Summert over alle førte kamper · trykk en kolonne for å sortere</span></div>';
    if (!prow.length) h += '<div class="empty">Ingen spillerregistreringer ennå.</div>';
    else h += '<div class="tbl-wrap"><table class="tbl t-players"><thead><tr>' + cols.map(([c, l]) => '<th aria-sort="' + (c === k ? (dir < 0 ? 'descending' : 'ascending') : 'none') + '"><button data-a="psort" data-k="' + c + '">' + l + '</button></th>').join('') + '</tr></thead><tbody>'
      + prow.map((p) => '<tr class="clickrow" data-a="kkpick" data-id="' + esc(p.id) + '" title="Vis kamp for kamp"><td class="key">' + (p.nr ? '#' + esc(p.nr) + ' ' : '') + esc(p.name) + '</td><td>' + p.games + '</td><td>' + p.recN + '</td><td class="key">' + avgBar(p.recAvg, d2(p.recAvg)) + '</td><td>' + p0(p.recPerf) + '</td><td>' + p.attN + '</td><td class="key">' + avgBar(p.attEff, d2(p.attEff), 'att', posOf(p.id)) + '</td><td>' + p.attK + '</td><td>' + p.srvN + '</td><td>' + p.srvE + '</td><td>' + p.srvF + '</td></tr>').join('')
      + '</tbody></table></div><div class="code-legend">Trykk en spiller for å se henne kamp for kamp. Snitt og prosent er regnet av summen av alle registreringer, ikke snitt av kampsnitt.</div>';
    h += '</section><div class="code-legend">Egenført 0–1–2-koding fra benken. Kamper som ikke er ført i appen telles i resultatet, men ikke i snittene. Ikke det samme som NVBF/DataProject-tallene. ' + legendLink() + '</div></div>';
    return h;
  }

  let resizeT = null;
  window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (S.view === 'season') render(); }, 200); });

  // ---------- Fullskjerm ----------
  function fsEl() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
  const fsOk = () => !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  function fsBtn(cls) { return '<button class="' + cls + '" data-a="fs">' + (fsEl() ? 'Avslutt fullskjerm' : 'Fullskjerm') + '</button>'; }
  let wakeLock = null;
  async function keepAwake(on) {
    try { if (on && navigator.wakeLock && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; } } catch (e) { wakeLock = null; }
  }
  // I fullskjerm ruller appen inni sin egen boks, så nettleseren ikke tolker rulling som et ønske om å vise faner
  let wantFs = false;
  function toTop() { try { window.scrollTo(0, 0); app.scrollTop = 0; } catch (e) {} }
  function enterFs() {

    if (a === 'clear-err') { S.error = ''; render(); }
    else if (a === 'fs') { toggleFs(); }
    else if (a === 'filter') { S.filter = b.dataset.v; try { localStorage.setItem('rv-view', JSON.stringify({ filter: S.filter })); } catch (e) {} render(); }
    else if (a === 'new-toggle') { S.showNew = !S.showNew; render(); }
    else if (a === 'open') {
      const mm = S.matches.find((x) => x.id === b.dataset.id); if (!mm) return;
      closeSeasonLogs();
      S.matchId = mm.id; S.statSet = 'all';
      S.view = S.dash ? 'detail' : canLive(mm) && mm.status !== 'ferdig' ? 'live' : 'detail'; S.detailSrc = 'egen';
      if (canLive(mm)) openLogs(mm.id);
      render(); toTop();
    }
    else if (a === 'back') { S.view = 'list'; S.matchId = null; openLogs(null); closeSeasonLogs(); render(); }
    else if (a === 'season') { S.view = 'season'; S.matchId = null; openLogs(null); openSeasonLogs(); render(); toTop(); }
    else if (a === 'incltest') { SEASON.inclTest = !SEASON.inclTest; try { localStorage.setItem('rv-incltest', SEASON.inclTest ? '1' : '0'); } catch (e) {} render(); }
    else if (a === 'metric') { SEASON.metric = b.dataset.v; render(); }
    else if (a === 'kkpick') { SEASON.player = b.dataset.id; render(); const c = document.getElementById('h-kurve'); if (c) c.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
    else if (a === 'psort') { const k = b.dataset.k; if (SEASON.sortK === k) SEASON.sortDir = -SEASON.sortDir; else { SEASON.sortK = k; SEASON.sortDir = k === 'name' ? 1 : -1; } render(); }
    else if (a === 'dir' && m) { dirOpen(); }
    else if (a === 'squad') { S.view = 'squad'; render(); toTop(); }
    else if (a === 'to-live') { S.view = S.view === 'sheet' && S.sheetBack === 'detail' ? 'detail' : 'live'; render(); toTop(); }
    else if (a === 'edit' && m) { S.view = 'live'; S.endingSet = false; render(); toTop(); }
    else if (a === 'toview' && m) { S.view = 'detail'; render(); toTop(); }
    else if (a === 'dsrc') { S.detailSrc = b.dataset.v; render(); }
    else if (a === 'ctx-cancel') { S.showNewCtx = false; render(); }
    else if (a === 'publish') { publishOpen('manuelt', true); }
    else if (a === 'share') { S.showShare = !S.showShare; S.copied = false; render(); }
    else if (a === 'share-copy') { copyShare(); }
    else if (a === 'share-native') { navigator.share({ title: CTX.name, text: 'Statistikk ' + CTX.name, url: siteUrl() }).catch((e) => { if (e && e.name !== 'AbortError') copyShare(); }); }
    else if (a === 'access' && S.canAdmin) { S.view = 'access'; S.matchId = null; openLogs(null); S.accHits = []; S.accPick = null; render(); toTop(); }
    else if (a === 'acc-pick') { const p = S.accHits.find((x) => x.id === b.dataset.id); if (p) { S.accPick = { id: p.id, name: p.name }; S.names[p.id] = p.name; render(); } }
    else if (a === 'acc-grant' && S.accPick) { const sel = document.getElementById('acc-ctx'); const g = Object.assign({}, S.grants || {}, { [S.accPick.id]: sel ? sel.value : CTX.id }); S.accPick = null; S.accHits = []; saveGrants(g); }
    else if (a === 'acc-del') { if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = 'Bekreft'; return; } const g = Object.assign({}, S.grants || {}); delete g[b.dataset.id]; saveGrants(g); }
    else if (a === 'clear-info') { S.info = ''; render(); }
    else if (a === 'table') { S.view = 'table'; S.matchId = null; openLogs(null); closeSeasonLogs(); render(); toTop(); }
    else if (a === 'focus' && m) {
      const team = b.dataset.v === 'away' ? m.away : m.home;
      const patch = { focus: team, receivers: [], onCourt: [], oppNumbers: [], current: m.current || { set: (m.setScores || []).length + 1, home: 0, away: 0 } };
      Object.assign(m, patch); S.view = 'squad'; openLogs(m.id); render(); toTop(); saveMatch(m.id, patch);
    }
    else if (a === 'unfocus' && m) { const patch = { focus: null, receivers: [], onCourt: [], oppNumbers: [] }; Object.assign(m, patch); S.view = 'detail'; openLogs(null); render(); saveMatch(m.id, patch); }
    else if (a === 'setslots' && m) { const patch = { home: b.dataset.h, away: b.dataset.w }; Object.assign(m, patch); render(); saveMatch(m.id, patch); }
    else if (a === 'delmatch' && m) {
      if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = 'Trykk igjen for å slette kampen og alle registreringene'; return; }
      deleteMatch(m);
    }
    else if (a === 'inseason' && m) { m.inSeason = m.inSeason === false; render(); saveMatch(m.id, { inSeason: m.inSeason }); }
    else if (a === 'orecv' && m) { const n = b.dataset.nr, list = (m.oppNumbers || []).map(String); setOppNumbers(m, list.includes(n) ? list.filter((x) => x !== n) : list.concat([n])); }
    else if (a === 'odel' && m) {
      if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = 'Bekreft'; return; }
      const n = b.dataset.nr, tm = b.dataset.team || oppTeam(m); saveOpp(m, rosterOf(tm).filter((p) => String(p.nr) !== n), tm); if (tm === oppTeam(m)) setOppNumbers(m, (m.oppNumbers || []).filter((x) => String(x) !== n));
    }
    else if (a === 'log') { logEvent(b.dataset.t, b.dataset.p, b.dataset.c); b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 300); }
    else if (a === 'undo') { undo(); }
    else if (a === 'statset') { S.statSet = b.dataset.v; render(); }
    else if (a === 'endset') { S.endingSet = true; render(); }
    else if (a === 'setcancel') { S.endingSet = false; render(); }
    else if (a === 'setwin-unused' && m) {
      const c = { set: 1, home: 0, away: 0, ...(m.current || {}) };
      const setScores = (m.setScores || []).concat([[1, 0]]);
      const setsHome = setScores.filter((s) => s[0] > s[1]).length, setsAway = setScores.length - setsHome;
      const nc = { set: c.set + 1, home: 0, away: 0 };
      Object.assign(m, { setScores, setsHome, setsAway, current: nc }); S.endingSet = false; S.statSet = 'all'; render();
      saveMatch(m.id, { setScores, setsHome, setsAway, current: nc, status: m.status === 'ferdig' ? 'ferdig' : 'pågår' });
    }
    else if (a === 'setback' && m) {
      const setScores = (m.setScores || []).slice(0, -1);
      const setsHome = setScores.filter((s) => s[0] > s[1]).length, setsAway = setScores.length - setsHome;
      const nc = { set: Math.max(1, ((m.current || {}).set || 1) - 1), home: 0, away: 0 };
      Object.assign(m, { setScores, setsHome, setsAway, current: nc }); render();
      saveMatch(m.id, { setScores, setsHome, setsAway, current: nc });
    }
    else if (a === 'endmatch' && m) { m.status = 'ferdig'; S.view = 'detail'; S.endingSet = false; render(); toTop(); saveMatch(m.id, { status: 'ferdig' }).then(() => setTimeout(() => publishOpen('kampen ferdig', true), 1500)); }
    else if (a === 'reopen' && m) { m.status = 'pågår'; render(); saveMatch(m.id, { status: 'pågår' }); }
    else if ((a === 'court' || a === 'recv') && m) {
      const key = a === 'court' ? 'onCourt' : 'receivers';
      const set = new Set(m[key] || []);
      if (set.has(b.dataset.id)) set.delete(b.dataset.id); else set.add(b.dataset.id);
      const order = teamRoster(m).map((p) => p.id).filter((id) => set.has(id));
      m[key] = order; render(); saveMatch(m.id, { [key]: order });
    }
    else if (a === 'addp') { const id = 'p' + Math.random().toString(36).slice(2, 8); saveRoster(S.roster.concat([{ id, nr: '', name: 'Ny spiller', pos: '' }])); }
    else if (a === 'delp') {
      const p = player(b.dataset.id);
      if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = 'Bekreft'; return; }
      if (p) saveRoster(S.roster.map((x) => x.id === p.id ? { ...x, archived: true } : x));
    }
    else if (a === 'export' && m) exportCsv(m);
    else if (a === 'sheet') { S.sheetBack = S.view; S.view = 'sheet'; render(); toTop(); }
    else if (a === 'pdf' && m) { if (window.PUBLIC && !document.getElementById('sk-sheet')) { const hold = document.createElement('div'); hold.style.cssText = 'position:absolute;left:-30000px;top:0'; hold.innerHTML = sheetView(); document.body.appendChild(hold); exportPdf(m, b).finally(() => hold.remove()); } else exportPdf(m, b); }
    else if (a === 'xlsx' && m) exportXlsx(m, b);
  });

  app.addEventListener('input', (ev) => {
    if (ev.target.id !== 'acc-q' || !S.user) return;
    const q = ev.target.value.trim();
    if (!q) { S.accHits = []; render(); return; }
    S.user.search(q).then((hits) => { if ((document.getElementById('acc-q') || {}).value?.trim() !== q) return; S.accHits = hits; hits.forEach((p) => { S.names[p.id] = p.name; }); render(); });
  });

  app.addEventListener('change', (ev) => {
    const el = ev.target; const a = el.dataset && el.dataset.a; if (!a) return;
    if (a === 'kkplayer') { SEASON.player = el.value; el.blur(); setTimeout(render, 0); return; }
    if (a === 'ctx') {
      el.blur();
      if (el.value === '__new') { el.value = CTX.id; S.showNewCtx = true; S.showNew = false; setTimeout(render, 0); return; }
      setTimeout(() => applyCtx(el.value), 0); return;
    }
    if ((a === 'onr' || a === 'oname' || a === 'opos') && cur()) {
      const m = cur(), nr = el.dataset.nr, val = el.value.trim(), tm = el.dataset.team || oppTeam(m);
      const ros = rosterOf(tm).map((p) => ({ ...p })); let p = ros.find((x) => String(x.nr) === nr);
      if (!p) { p = { nr }; ros.push(p); }
      if (a === 'onr') {
        const v = val.replace(/[^0-9]/g, '');
        if (!v || (v !== nr && ros.some((x) => String(x.nr) === v))) { S.error = v ? 'Nummer ' + v + ' finnes allerede.' : 'Draktnummer må fylles ut.'; render(); return; }
        p.nr = v; saveOpp(m, ros, tm);
        if (tm === oppTeam(m) && (m.oppNumbers || []).map(String).includes(nr)) setOppNumbers(m, m.oppNumbers.map((x) => String(x) === nr ? v : x));
      } else { p[a === 'oname' ? 'name' : 'pos'] = val; saveOpp(m, ros, tm); }
      return;
    }
    if (a === 'nr' || a === 'name' || a === 'pos') {
      const field = a === 'nr' ? 'nr' : a === 'name' ? 'name' : 'pos';
      const val = el.value.trim();
      if (field === 'name' && !val) { render(); return; }
      saveRoster(S.roster.map((p) => p.id === el.dataset.id ? { ...p, [field]: val } : p));
    }
  });

  app.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const f = ev.target; const m = cur();
    if (f.id === 'setform' && m) {
      const h = parseInt((document.getElementById('sv-home').value || '').trim(), 10);
      const a = parseInt((document.getElementById('sv-away').value || '').trim(), 10);
      if (isNaN(h) || isNaN(a)) { S.error = 'Skriv inn poeng for begge lag.'; render(); return; }
      if (h === a) { S.error = 'Et sett kan ikke ende likt. Sjekk resultatet.'; render(); return; }
      const c = { set: 1, home: 0, away: 0, ...(m.current || {}) };
      const setScores = (m.setScores || []).concat([[h, a]]);
      const setsHome = setScores.filter((x) => x[0] > x[1]).length, setsAway = setScores.length - setsHome;
      const nc = { set: c.set + 1, home: 0, away: 0 };
      Object.assign(m, { setScores, setsHome, setsAway, current: nc }); S.endingSet = false; S.error = ''; S.statSet = 'all'; render();
      saveMatch(m.id, { setScores, setsHome, setsAway, current: nc, status: m.status === 'ferdig' ? 'ferdig' : 'pågår' })
        .then(() => setTimeout(() => publishOpen('sett ' + setScores.length + ' ferdig'), 1500));
      return;
    }
    if (f.id === 'ctxform' && S.db) {
      const name = document.getElementById('ctx-name').value.trim(), our = document.getElementById('ctx-our').value.trim();
      if (!name || !our) { S.error = 'Fyll inn navn og vårt lag.'; render(); return; }
      const id = teamSlug(name).slice(0, 40) + '-' + Date.now().toString(36);
      const ctx = { id, name, our, gender: document.getElementById('ctx-gender').value, prefix: 'ctx/' + id + '/', teams: [] };
      try {
        if (document.getElementById('ctx-copy').checked && S.roster.length) await S.db.doc(ctx.prefix + 'config/roster').set({ players: S.roster.filter((p) => !p.archived) });
        const list = S.contexts.filter((c) => c.id !== 'main').concat([ctx]);
        await S.db.doc('config/contexts').set({ list });
        S.contexts = [MAIN_CTX].concat(list); applyCtx(id);
      } catch (e) { S.error = 'Kunne ikke opprette (' + e.code + ').'; render(); }
      return;
    }
    if (f.id.startsWith('oppaddform') && m) {
      const tm = f.dataset.team || oppTeam(m), sl = teamSlug(tm);
      const v = (document.getElementById('opp-add-nr-' + sl).value || '').replace(/[^0-9]/g, '');
      const nm = (document.getElementById('opp-add-name-' + sl).value || '').trim();
      if (!v) { S.error = 'Draktnummer må fylles ut.'; render(); return; }
      const ros = rosterOf(tm).map((p) => ({ ...p })); const p = ros.find((x) => String(x.nr) === v);
      if (p) { if (nm) p.name = nm; } else ros.push(nm ? { nr: v, name: nm } : { nr: v });
      saveOpp(m, ros, tm); if (tm === oppTeam(m)) setOppNumbers(m, (m.oppNumbers || []).concat([v]));
      const inp = document.getElementById('opp-add-nr-' + sl); if (inp) { inp.value = ''; inp.focus(); }
      return;
    }
    if (f.id === 'resform' && m) {
      const sc = [];
      for (let i = 0; i < 5; i++) {
        const h = document.getElementById('rs-h-' + i).value.trim(), a = document.getElementById('rs-a-' + i).value.trim();
        if (h === '' && a === '') continue;
        const hn = parseInt(h, 10), an = parseInt(a, 10);
        if (isNaN(hn) || isNaN(an) || hn === an) { S.error = 'Sett ' + (i + 1) + ': skriv inn poeng for begge lag, og ikke likt.'; render(); return; }
        sc.push([hn, an]);
      }
      const sh = sc.filter((x) => x[0] > x[1]).length, sa = sc.length - sh;
      Object.assign(m, { setScores: sc, setsHome: sh, setsAway: sa, status: sc.length ? 'ferdig' : 'kommende' }); S.error = ''; render();
      saveMatch(m.id, { setScores: sc, setsHome: sh, setsAway: sa, status: sc.length ? 'ferdig' : 'kommende' }).then(() => setTimeout(() => publishOpen('resultat ' + shortName(m.home) + '–' + shortName(m.away)), 1500));
      return;
    }
    if (f.id === 'oppform' && m) {
      const v = (document.getElementById('opp-nr').value || '').replace(/[^0-9]/g, '');
      if (!v) return;
      const list = (m.oppNumbers || []).slice();
      if (!list.includes(v)) { list.push(v); list.sort((x, y) => Number(x) - Number(y)); m.oppNumbers = list; render(); saveMatch(m.id, { oppNumbers: list }); }
      const inp = document.getElementById('opp-nr'); if (inp) { inp.value = ''; inp.focus(); }
    }
    if (f.id === 'newform' && S.db) {
      const opp = document.getElementById('nf-opp').value.trim().replace(/\s+/g, ' ');
      if (!opp) { S.error = 'Skriv inn motstanderlaget.'; render(); return; }
      const type = document.getElementById('nf-type').value; const inSeason = document.getElementById('nf-season').checked;
      const home = document.getElementById('nf-ha').value === 'h';
      const date = document.getElementById('nf-date').value;
      const round = document.getElementById('nf-round').value.trim();
      const venue = document.getElementById('nf-venue').value.trim();
      const doc = { home: home ? OUR : opp, away: home ? opp : OUR, date, round: round || null, venue: venue || null, source: 'egen', custom: true, type, inSeason, status: 'kommende', setsHome: 0, setsAway: 0, setScores: [], current: { set: 1, home: 0, away: 0 }, receivers: [], onCourt: [], oppNumbers: [] };
      try { const ref = await S.db.collection(PFX + 'matches').add(doc); S.showNew = false; S.matchId = ref.id; S.view = 'squad'; openLogs(ref.id); render(); }
      catch (e) { S.error = e.code === 'quota_exceeded' ? 'Lagringen er full. Slett gamle kamper først.' : 'Kampen ble ikke opprettet (' + e.code + ').'; render(); }
    }
  });

  async function exportCsv(m) {
    const oppName = m.home === usName(m) ? m.away : m.home;
    const rows = [['sett', 'type', 'spiller', 'nr', 'kode', 'tid']];
    allEvents().forEach((e) => {
      const p = (e.type === 'opp' || e.type === 'dir') ? null : player(e.p);
      rows.push([e.set,{ rec: 'Mottak', att: 'Angrep', srv: 'Serve', opp: oppName + ' mottak', dir: oppName + ' slagretning' }[e.type], p ? p.name : ((e.type === 'opp' || e.type === 'dir') ? oppName : ''), p ? (p.nr || '') : e.p, e.type === 'dir' ? dirKind(e) + ' sone ' + (dirZone(e) || '–') + (e.c ? ' ' + DRES[e.c] : '') : e.c, new Date(e.t).toLocaleTimeString('nb-NO')]);
    });
    const csv = rows.map((r) => r.map((x) => '"' + String(x).replace(/"/g, '""') + '"').join(';')).join('\r\n');
    try { await S.dl.save({ filename: ('kamp-' + m.home + '-' + m.away).replace(/[^\wæøåÆØÅ-]+/g, '-') + '.csv', data: '﻿' + csv }); }
    catch (e) { if (e.code !== 'declined') { S.error = 'Eksporten feilet (' + e.code + ').'; render(); } }
  }

  render();
  boot();
})();
</script>
